/* ---------------- helpers ---------------- */
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const todayISO = () => new Date().toISOString().slice(0, 10);
const fmtDMY = (iso) => {
  if (!iso) return '-';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' });
};
const dayCount = (admissionISO) => {
  if (!admissionISO) return 1;
  const a = new Date(admissionISO + 'T00:00:00');
  const t = new Date(todayISO() + 'T00:00:00');
  return Math.max(1, Math.round((t - a) / 86400000) + 1);
};
const isAbnormal = (name, value) => {
  const r = LAB_RANGES[name];
  const v = parseFloat(value);
  if (!r || isNaN(v)) return false;
  return v < r[0] || v > r[1];
};
const planEntries = (plan) => {
  if (!plan) return [];
  if (plan.entries) return plan.entries;
  return [
    ...(plan.items || []).map((t) => ({ id: uid(), text: t })),
    ...((plan.customItems || []).map((c) => ({ id: c.id, text: c.text })))
  ];
};

const sortByWardBed = (a, b) => {
  const parse = (s) => (s || '').split('/').map((x) => parseInt(x, 10));
  const [aw, ab] = parse(a.ward + '/' + a.bed);
  const [bw, bb] = parse(b.ward + '/' + b.bed);
  if (!isNaN(aw) && !isNaN(bw) && aw !== bw) return aw - bw;
  if (!isNaN(ab) && !isNaN(bb)) return ab - bb;
  return (a.ward + a.bed).localeCompare(b.ward + b.bed);
};

async function fileToResizedDataUrl(file, maxW = 700, quality = 0.6) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new window.Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function callClaudeVision(dataUrl, instructionText) {
  const base64 = dataUrl.split(',')[1];
  const mediaType = dataUrl.substring(5, dataUrl.indexOf(';'));
  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 1000,
      messages: [{
        role: 'user',
        content: [
          { type: 'image', source: { type: 'base64', media_type: mediaType, data: base64 } },
          { type: 'text', text: instructionText }
        ]
      }]
    })
  });
  const data = await response.json();
  const block = (data.content || []).find((b) => b.type === 'text');
  let raw = block ? block.text : '{}';
  raw = raw.replace(/```json|```/g, '').trim();
  try { return JSON.parse(raw); } catch (e) { return null; }
}

async function storageGet(key, fallback) {
  try {
    const raw = window.localStorage.getItem('surgical-round:' + key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) { return fallback; }
}
async function storageSet(key, value) {
  return new Promise((resolve) => {
    setTimeout(() => {
      try { window.localStorage.setItem('surgical-round:' + key, JSON.stringify(value)); resolve(true); }
      catch (e) { resolve(false); }
    }, 0);
  });
}

  try {
    const appMod = await import('https://esm.sh/firebase@10.12.2/app');

const FIRM_CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no O/0/I/1 to avoid mix-ups
function generateFirmCode() {
  let code = '';
  for (let i = 0; i < 6; i++) code += FIRM_CODE_CHARS[Math.floor(Math.random() * FIRM_CODE_CHARS.length)];
  return code;
}

  consultantId: '',
  ward: '', bed: '',
  diagnosis: '',
  admissionDate: todayISO(),
  admissionType: 'elective',
  age: '',
  comorbidities: [],
  comorbidityOther: '',
  pastSurgicalHx: '',
  erPresentation: '',
  operationDone: false,
  operationFindings: '',
  seenToday: { items: [], customItems: [] },
  exam: { abdomen: '', pr: '', others: '' },
  vitals: { stable: true, hr: '', bp: '', rr: '', temp: '', spo2: '', rbg: '' },

function App() {
  const [loading, setLoading] = useState(true);
  const [consultants, setConsultants] = useState([]);
  const [patients, setPatients] = useState([]);
  const [favoriteMeds, setFavoriteMeds] = useState([]);
  const [selectedConsultants, setSelectedConsultants] = useState([]); // [] = all
  const [modalPatient, setModalPatient] = useState(null); // draft object or null
  const [isNewPatient, setIsNewPatient] = useState(false);
  const [pageMode, setPageMode] = useState('view'); // 'view' | 'edit'
  const [activeTab, setActiveTab] = useState('overview');
  const [showConsultantMgr, setShowConsultantMgr] = useState(false);
  const [showExport, setShowExport] = useState(false);
  const [exportConfig, setExportConfig] = useState(null);
  const [confirmDischargeId, setConfirmDischargeId] = useState(null);
  const [toast, setToast] = useState('');

  const [firmStatus, setFirmStatus] = useState('checking'); // 'checking' | 'gate' | 'connected' | 'local'
  const [firmCode, setFirmCode] = useState(null);
  const [firmError, setFirmError] = useState('');
  const unsubRef = useRef(null);
  const unsubPatientsRef = useRef(null);

  const firmDocRef = (code) => {
    const db = firestoreApi.getFirestore(firebaseApp);
    return firestoreApi.doc(db, 'firms', code);
  };
  const patientDocRef = (code, patientId) => {
    const db = firestoreApi.getFirestore(firebaseApp);
    return firestoreApi.doc(db, 'firms', code, 'patients', patientId);
  };
  const patientsColRef = (code) => {
    const db = firestoreApi.getFirestore(firebaseApp);
    return firestoreApi.collection(db, 'firms', code, 'patients');
  };

  const connectToFirm = async (code) => {
    try {
      const ref = firmDocRef(code);
      const snap = await firestoreApi.getDoc(ref);
      if (!snap.exists()) { setFirmError('No firm found with that code'); return false; }
      if (unsubRef.current) unsubRef.current();
      if (unsubPatientsRef.current) unsubPatientsRef.current();

      unsubRef.current = firestoreApi.onSnapshot(ref, (s) => {
        const d = s.data() || {};
        setConsultants(d.consultants || []);
        setFavoriteMeds(d.favoriteMeds || []);
      });
      unsubPatientsRef.current = firestoreApi.onSnapshot(patientsColRef(code), (qs) => {
        const list = [];
        qs.forEach((d) => list.push(d.data()));
        setPatients(list);
        setLoading(false);
      });

      try { window.localStorage.setItem('surgical-round:firmCode', code); } catch (e) {}
      setFirmCode(code);
      setFirmStatus('connected');
      setFirmError('');
      return true;
    } catch (e) { setFirmError('Could not connect — check your connection'); return false; }
  };

  const createFirm = async () => {
    const code = generateFirmCode();
    try {
      await firestoreApi.setDoc(firmDocRef(code), { consultants: [], favoriteMeds: [] });
      return code;
    } catch (e) { setFirmError('Could not create a firm — check your connection'); return null; }
  };

  const leaveFirm = () => {
    if (unsubRef.current) { unsubRef.current(); unsubRef.current = null; }
    if (unsubPatientsRef.current) { unsubPatientsRef.current(); unsubPatientsRef.current = null; }
    try { window.localStorage.removeItem('surgical-round:firmCode'); } catch (e) {}
    setFirmCode(null);
    setConsultants([]); setPatients([]); setFavoriteMeds([]);
    setFirmStatus('gate');
  };

  const continueLocally = async () => {
    const c = await storageGet('consultants', []);
    const p = await storageGet('patients', []);
    const fm = await storageGet('favoriteMeds', []);
    setConsultants(c); setPatients(p); setFavoriteMeds(fm);
    setFirmStatus('local');
    setLoading(false);
  };

  useEffect(() => {
    (async () => {
      const available = await initFirebase();
      if (!available) { await continueLocally(); return; }
      let savedCode = null;
      try { savedCode = window.localStorage.getItem('surgical-round:firmCode'); } catch (e) {}
      if (savedCode) {
        const ok = await connectToFirm(savedCode);
        if (!ok) { setFirmStatus('gate'); setLoading(false); }
      } else {
        setFirmStatus('gate');
        setLoading(false);
      }
    })();
  }, []);

  useEffect(() => {
    if (exportConfig) {
      const t = setTimeout(() => window.print(), 150);
      return () => clearTimeout(t);
    }
  }, [exportConfig]);

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(''), 2200); };

  const saveConsultants = async (next) => {
    setConsultants(next);
    if (firmStatus === 'connected') await firestoreApi.setDoc(firmDocRef(firmCode), { consultants: next }, { merge: true });
    else await storageSet('consultants', next);
  };
  const upsertPatient = async (patient) => {
    const exists = patients.some((p) => p.id === patient.id);
    const next = exists ? patients.map((p) => (p.id === patient.id ? patient : p)) : [...patients, patient];
    setPatients(next);
    if (firmStatus === 'connected') await firestoreApi.setDoc(patientDocRef(firmCode, patient.id), patient);
    else await storageSet('patients', next);
  };
  const removePatient = async (id) => {
    const next = patients.filter((p) => p.id !== id);
    setPatients(next);
    if (firmStatus === 'connected') await firestoreApi.deleteDoc(patientDocRef(firmCode, id));
    else await storageSet('patients', next);
  };
  const addFavoriteMed = async (fav) => {
    const next = [...favoriteMeds, { id: uid(), ...fav }];
    setFavoriteMeds(next);
    if (firmStatus === 'connected') await firestoreApi.setDoc(firmDocRef(firmCode), { favoriteMeds: next }, { merge: true });
    else await storageSet('favoriteMeds', next);
  };
  const removeFavoriteMed = async (id) => {
    const next = favoriteMeds.filter((f) => f.id !== id);
    setFavoriteMeds(next);
    if (firmStatus === 'connected') await firestoreApi.setDoc(firmDocRef(firmCode), { favoriteMeds: next }, { merge: true });
    else await storageSet('favoriteMeds', next);
  };

  const consultantById = (id) => consultants.find((c) => c.id === id);

  const visiblePatients = useMemo(() => {
    const list = selectedConsultants.length === 0
      ? patients
      : patients.filter((p) => selectedConsultants.includes(p.consultantId));
    return [...list].sort(sortByWardBed);
  }, [patients, selectedConsultants]);

  const toggleConsultantFilter = (id) => {
    setSelectedConsultants((prev) => prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]);
  };

  const openNewPatient = () => {
    const draft = blankPatient();
    if (selectedConsultants.length === 1) draft.consultantId = selectedConsultants[0];
    setModalPatient(draft);
    setIsNewPatient(true);
    setPageMode('edit');
    setActiveTab('overview');
  };
  const openEditPatient = (p) => {
    setModalPatient(typeof structuredClone === 'function' ? structuredClone(p) : JSON.parse(JSON.stringify(p)));
    setIsNewPatient(false);
    setPageMode('view');
    setActiveTab('overview');
  };
  const closeModal = () => setModalPatient(null);

  const handleSavePatient = async () => {
    if (!modalPatient.consultantId || !modalPatient.ward || !modalPatient.bed || !modalPatient.diagnosis) {
      showToast('Please fill consultant, ward, bed and diagnosis');
      return;
    }
    await upsertPatient(modalPatient);
    setIsNewPatient(false);
    setPageMode('view');
    showToast('Patient saved');
  };

  const handleDischarge = async (id) => {
    await removePatient(id);
    setConfirmDischargeId(null);
    setModalPatient(null);
    showToast('Patient discharged and removed');
  };

  if (loading) {
    return (
      <div style={{ background: PAPER, minHeight: '100vh' }} className="flex items-center justify-center">
        <Loader2 className="animate-spin" color={ACCENT} size={28} />
      </div>
    );
  }

  if (firmStatus === 'gate') {
    return <FirmGate onCreate={createFirm} onJoin={connectToFirm} onSkip={continueLocally} error={firmError} />;
  }

  return (
    <div style={{ background: PAPER, minHeight: '100vh', fontFamily: "'Inter', system-ui, sans-serif", color: INK }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');
        .font-display { font-family: 'Space Grotesk', system-ui, sans-serif; }
        .font-mono { font-family: 'IBM Plex Mono', monospace; }
        @media print {
          .no-print { display: none !important; }
          .print-only { display: block !important; }
          body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
        .print-only { display: none; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: #C7CCDA; border-radius: 8px; }
        input[type="date"] {
          -webkit-appearance: none;
          appearance: none;
          width: 100%;
          box-sizing: border-box;
          min-width: 0;
          display: block;
        }
      `}</style>

      <div className="no-print">
        <TopBar
          onAdd={openNewPatient}
          onManageConsultants={() => setShowConsultantMgr(true)}
          onExport={() => setShowExport(true)}
          firmStatus={firmStatus}
          firmCode={firmCode}
          onLeaveFirm={leaveFirm}
        />

        <ConsultantFilterBar
          consultants={consultants}
          selected={selectedConsultants}
          onToggle={toggleConsultantFilter}
          onClear={() => setSelectedConsultants([])}
        />

        <main className="max-w-4xl mx-auto px-4 pb-24 pt-4">
          {visiblePatients.length === 0 && (
            <EmptyState hasConsultants={consultants.length > 0}
              onAddConsultant={() => setShowConsultantMgr(true)}
              onAddPatient={openNewPatient} />
          )}
          <div className="space-y-3">
            {visiblePatients.map((p) => (
              <PatientCard key={p.id} patient={p} consultant={consultantById(p.consultantId)} onOpen={() => openEditPatient(p)} />
            ))}
          </div>
        </main>

        {toast && (
          <div className="fixed bottom-6 left-1/2 -translate-x-1/2 px-4 py-2 rounded-lg shadow-lg text-sm font-medium text-white z-50" style={{ background: INK }}>
            {toast}
          </div>
        )}
      </div>

      {modalPatient && (
        <PatientDetailPage
          draft={modalPatient}
          setDraft={setModalPatient}
          consultants={consultants}
          isNew={isNewPatient}
          pageMode={pageMode}
          setPageMode={setPageMode}
          activeTab={activeTab}
          setActiveTab={setActiveTab}
          onClose={closeModal}
          onSave={handleSavePatient}
          onRequestDischarge={() => setConfirmDischargeId(modalPatient.id)}
          showToast={showToast}
          favoriteMeds={favoriteMeds}
          onAddFavoriteMed={addFavoriteMed}
          onRemoveFavoriteMed={removeFavoriteMed}
        />
      )}

      {showConsultantMgr && (
        <ConsultantManagerModal
          consultants={consultants}
          onClose={() => setShowConsultantMgr(false)}
          onSave={saveConsultants}
        />
      )}

      {showExport && (
        <ExportModal
          consultants={consultants}
          onClose={() => setShowExport(false)}
          onConfirm={(cfg) => { setExportConfig(cfg); setShowExport(false); }}
        />
      )}

      {confirmDischargeId && (
        <ConfirmModal
          title="Discharge patient?"
          message="This will permanently remove the patient from the round list. This cannot be undone."
          confirmLabel="Discharge patient"
          danger
          onCancel={() => setConfirmDischargeId(null)}
          onConfirm={() => handleDischarge(confirmDischargeId)}
        />
      )}

      {exportConfig && (
        <PrintView
          config={exportConfig}
          patients={patients}
          consultants={consultants}
        />
      )}
    </div>
  );
}

/* ---------------- Firm Gate (create/join a shared firm) ---------------- */
function FirmGate({ onCreate, onJoin, onSkip, error }) {
  const [mode, setMode] = useState('start'); // 'start' | 'join' | 'created'
  const [joinCode, setJoinCode] = useState('');
  const [newCode, setNewCode] = useState('');
  const [busy, setBusy] = useState(false);

  const handleCreate = async () => {
    setBusy(true);
    const code = await onCreate();
    setBusy(false);
    if (code) { setNewCode(code); setMode('created'); }
  };
  const handleJoin = async () => {
    if (!joinCode.trim()) return;
    setBusy(true);
    await onJoin(joinCode.trim().toUpperCase());
    setBusy(false);
  };

  return (
    <div style={{ background: PAPER, minHeight: '100vh', fontFamily: "'Inter', system-ui, sans-serif", color: INK }} className="flex items-center justify-center p-4">
      <style>{`@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap'); .font-display { font-family: 'Space Grotesk', system-ui, sans-serif; }`}</style>
      <div className="bg-white w-full max-w-sm rounded-2xl border p-6" style={{ borderColor: LINE }}>
        <div style={{ background: INK }} className="w-11 h-11 rounded-xl flex items-center justify-center mb-4">
          <Stethoscope size={20} color="#fff" />
        </div>
        <h1 className="font-display font-semibold text-xl mb-1" style={{ color: INK }}>Morning Round</h1>

        {mode === 'start' && (
          <>
            <p className="text-sm mb-5" style={{ color: SLATE }}>Share the round list with your team, or keep it on this device only.</p>
            <div className="space-y-2.5">
              <button onClick={handleCreate} disabled={busy} className="w-full px-4 py-3 rounded-lg text-sm font-semibold text-white" style={{ background: ACCENT }}>
                {busy ? 'Creating…' : 'Create a new firm'}
              </button>
              <button onClick={() => setMode('join')} className="w-full px-4 py-3 rounded-lg text-sm font-semibold border" style={{ borderColor: LINE, color: INK }}>
                Join a firm with a code
              </button>
              <button onClick={onSkip} className="w-full px-4 py-2 text-xs font-medium" style={{ color: SLATE }}>
                Continue on this device only
              </button>
            </div>
          </>
        )}

        {mode === 'join' && (
          <>
            <p className="text-sm mb-4" style={{ color: SLATE }}>Enter the 6-character code a colleague shared with you.</p>
            <input
              value={joinCode}
              onChange={(e) => setJoinCode(e.target.value.toUpperCase())}
              onKeyDown={(e) => e.key === 'Enter' && handleJoin()}
              placeholder="e.g. K7P2QX"
              maxLength={6}
              className="w-full border rounded-lg px-3 py-3 text-lg font-mono text-center tracking-widest mb-2"
              style={{ borderColor: LINE, boxSizing: 'border-box' }}
            />
            {error && <p className="text-xs mb-2" style={{ color: RED }}>{error}</p>}
            <div className="space-y-2.5">
              <button onClick={handleJoin} disabled={busy} className="w-full px-4 py-3 rounded-lg text-sm font-semibold text-white" style={{ background: ACCENT }}>
                {busy ? 'Joining…' : 'Join firm'}
              </button>
              <button onClick={() => setMode('start')} className="w-full px-4 py-2 text-xs font-medium" style={{ color: SLATE }}>Back</button>
            </div>
          </>
        )}

        {mode === 'created' && (
          <>
            <p className="text-sm mb-3" style={{ color: SLATE }}>Share this code with your colleagues so they can join:</p>
            <div className="text-center py-4 rounded-lg mb-4" style={{ background: PAPER }}>
              <span className="font-mono font-bold text-3xl tracking-widest" style={{ color: INK }}>{newCode}</span>
            </div>
            <p className="text-[11px] mb-4" style={{ color: SLATE }}>Anyone with this code can view and edit this round list — treat it like a shared password.</p>
            <button
              onClick={async () => { setBusy(true); await onJoin(newCode); setBusy(false); }}
              disabled={busy}
              className="w-full px-4 py-3 rounded-lg text-sm font-semibold text-white"
              style={{ background: ACCENT }}
            >
              {busy ? 'Connecting…' : "I've saved the code — continue"}
            </button>
          </>
        )}
      </div>
    </div>
  );
}

    <div className="max-w-4xl mx-auto px-4 pt-3 flex flex-wrap gap-2">

/* ---------------- Patient Card ---------------- */
function PatientCard({ patient, consultant, onOpen }) {
  const day = dayCount(patient.admissionDate);
  const onAbx = patient.meds.antibiotics.length > 0;
  const latestFlags = Object.entries(patient.labs).filter(([name, arr]) => arr.length && isAbnormal(name, arr[arr.length - 1].value));

  return (
    <button
      onClick={onOpen}
      className="w-full text-left bg-white rounded-xl border p-3.5 flex items-center gap-3 hover:shadow-sm transition-shadow"
      style={{ borderColor: LINE, borderLeft: `4px solid ${consultant ? consultant.color : LINE}` }}
    >
      <div className="shrink-0 text-center w-16">
        <div className="font-mono font-semibold text-base" style={{ color: INK }}>{patient.ward}/{patient.bed}</div>
        <div className="text-[11px]" style={{ color: SLATE }}>Day {day}</div>
      </div>
      <div className="flex-1 min-w-0">
        <div className="flex items-center gap-2 flex-wrap">
          <span className="font-medium text-sm truncate" style={{ color: INK }}>{patient.diagnosis || 'No diagnosis set'}</span>
          <span
            className="text-[10px] font-semibold px-1.5 py-0.5 rounded uppercase"
            style={{ background: patient.admissionType === 'emergency' ? '#FBE7EA' : '#E9F5EA', color: patient.admissionType === 'emergency' ? RED : GREEN }}
          >
            {patient.admissionType}
          </span>
        </div>
        <div className="flex items-center gap-2.5 mt-1 text-[11px]" style={{ color: SLATE }}>
          {consultant && <span>{consultant.name}</span>}
          {patient.age && <span>· Age {patient.age}</span>}
          {onAbx && <span className="flex items-center gap-0.5"><Pill size={11} /> {patient.meds.antibiotics.length} abx</span>}
          {patient.vitals && !patient.vitals.stable && (
            <span className="flex items-center gap-0.5 font-semibold" style={{ color: RED }}>
              <Heart size={11} /> Not stable
            </span>
          )}
          {latestFlags.length > 0 && (
            <span className="flex items-center gap-0.5 font-semibold" style={{ color: RED }}>
              <AlertTriangle size={11} /> {latestFlags.length} abnormal
            </span>
          )}
        </div>
      </div>
      <Edit2 size={15} color={SLATE} className="shrink-0" />
    </button>
  );
}

/* ---------------- Patient Detail Page (full page: View + Edit) ---------------- */

    { id: 'vitals', label: 'Vitals', icon: Heart, color: '#2CA6A4' },
    { id: 'labs', label: 'Labs', icon: Activity, color: ACCENT },
    { id: 'imaging', label: 'Imaging', icon: ImageIcon, color: '#9C4FE0' },
    { id: 'meds', label: 'Meds', icon: Pill, color: AMBER },
    { id: 'consult', label: 'Consult', icon: Users, color: '#C2578B' },
    { id: 'progress', label: 'Progress', icon: FileText, color: '#6B7280' },
    { id: 'plan', label: 'Plan', icon: Check, color: GREEN }

  const isViewing = pageMode === 'view' && !isNew;

    <div className="fixed inset-0 z-40 bg-white flex flex-col">

          <button onClick={onClose}><ArrowLeft size={19} color={INK} /></button>
          <div className="min-w-0">
            <h2 className="font-display font-semibold text-base leading-tight truncate" style={{ color: INK }}>
              {isNew ? 'Add patient' : `${draft.ward || '—'}/${draft.bed || '—'} — ${draft.diagnosis || 'No diagnosis'}`}
            </h2>
            {!isNew && consultant && <p className="text-[11px] leading-tight" style={{ color: SLATE }}>{consultant.name} · Day {dayCount(draft.admissionDate)}</p>}
          </div>
        </div>
        {isViewing ? (
          <button onClick={() => setPageMode('edit')} className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-semibold text-white shrink-0" style={{ background: ACCENT }}>
            <Edit2 size={14} /> Edit
          </button>
        ) : <span className="w-6 shrink-0" />}
      </div>

      {isViewing ? (
        <>
          <div className="flex-1 overflow-y-auto">
            <PatientView patient={draft} consultant={consultant} />

          <div className="px-4 py-3 border-t shrink-0" style={{ borderColor: LINE }}>

      ) : (
        <>
          <div className="grid grid-cols-4 gap-1.5 px-3 py-2.5 border-b shrink-0" style={{ borderColor: LINE, background: PAPER }}>

              const Icon = t.icon;
              const active = activeTab === t.id;
              return (
                <button
                  key={t.id}
                  onClick={() => setActiveTab(t.id)}
                  className="flex flex-col items-center justify-center gap-1 py-2 rounded-xl text-[11px] font-semibold border transition-colors"
                  style={active
                    ? { background: t.color, borderColor: t.color, color: '#fff' }
                    : { background: '#fff', borderColor: LINE, color: SLATE }}
                >
                  <Icon size={16} />
                  {t.label}
                </button>
              );
            })}
          </div>

          <div className="flex-1 overflow-y-auto px-4 py-4">
            {activeTab === 'overview' && <OverviewTab draft={draft} update={update} consultants={consultants} />}
            {activeTab === 'vitals' && <VitalsTab draft={draft} update={update} />}
            {activeTab === 'labs' && <LabsTab draft={draft} update={update} showToast={showToast} />}
            {activeTab === 'imaging' && <ImagingTab draft={draft} update={update} showToast={showToast} />}
            {activeTab === 'meds' && <MedsTab draft={draft} update={update} favoriteMeds={favoriteMeds} onAddFavoriteMed={onAddFavoriteMed} onRemoveFavoriteMed={onRemoveFavoriteMed} />}
            {activeTab === 'consult' && <ConsultTab draft={draft} update={update} />}
            {activeTab === 'progress' && <ProgressTab draft={draft} update={update} />}
            {activeTab === 'plan' && <PlanTab draft={draft} update={update} />}

              <button onClick={onRequestDischarge} className="text-sm font-semibold px-3 py-2 rounded-lg" style={{ color: RED }}>
                Discharge patient

              <button onClick={onClose} className="px-4 py-2 rounded-lg text-sm font-medium border" style={{ borderColor: LINE, color: INK }}>Cancel</button>

            </div>
          </div>

    <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4" onClick={onClose}>
      <button onClick={onClose} className="absolute top-4 right-4 p-2"><X size={24} color="#fff" /></button>
      <img src={src} className="max-w-full max-h-full rounded-lg object-contain" onClick={(e) => e.stopPropagation()} alt="Full size" />

function PatientView({ patient: p, consultant }) {
  const [lightbox, setLightbox] = useState(null);

    <>
    <div>

          <p><span style={{ color: SLATE }}>Age:</span> {p.age || '-'}</p>

          {p.pastSurgicalHx && <p><span style={{ color: SLATE }}>Past surgical hx:</span> {p.pastSurgicalHx}</p>}
          {p.erPresentation && <p><span style={{ color: SLATE }}>History:</span> {p.erPresentation}</p>}

            ? <p className="text-sm" style={{ color: SLATE }}>Not recorded yet</p>

        })()}
      </ViewSection>

      <ViewSection icon={Stethoscope} color={INK} label="O/E">

            {p.exam.others && <p><span style={{ color: SLATE }}>Others:</span> {p.exam.others}</p>}

                    </p>
                  );
                })()}

            ) : <p style={{ color: SLATE }}>No readings recorded yet</p>}
          </div>
        ) : <p className="text-sm" style={{ color: SLATE }}>Not recorded</p>}

          <div className="space-y-2">
            {Object.entries(p.labs).map(([name, arr]) => (

                    <React.Fragment key={i}>

                  );
                })}
              </div>
            ))}
          </div>

      </ViewSection>

      <ViewSection icon={Activity} color={RED} label="Culture results">

          <div className="space-y-2">
            {[...p.cultures].reverse().map((c) => (

                  <p className="text-sm" style={{ color: SLATE }}>
                    {c.organism || 'Organism not specified'}{c.sensitiveTo ? ` · Sensitive: ${c.sensitiveTo}` : ''}{c.resistantTo ? ` · Resistant: ${c.resistantTo}` : ''}

              </div>
            ))}
          </div>
        )}
      </ViewSection>

      <ViewSection icon={ImageIcon} color="#9C4FE0" label="Imaging">
        {p.imaging.length === 0 ? <p className="text-sm" style={{ color: SLATE }}>No imaging recorded</p> : (
          <div className="space-y-2.5">
            {p.imaging.map((im) => (
              <div key={im.id} className="flex gap-3">
                {im.image && <img src={im.image} onClick={() => setLightbox(im.image)} className="w-14 h-14 object-cover rounded-md shrink-0 cursor-pointer" alt={im.type} />}
                <div>
                  <p className="text-sm font-semibold" style={{ color: INK }}>{im.type}</p>
                  <p className="text-sm" style={{ color: SLATE }}>{im.findings || 'No findings noted'}</p>

              </div>

      <ViewSection icon={Pill} color={AMBER} label="Medications">

          {p.meds.prn.length > 0 && <p><span style={{ color: SLATE }}>PRN:</span> {p.meds.prn.map((m) => m.name + (m.dose ? ` ${m.dose}` : '') + (m.frequency ? ` ${m.frequency}` : '')).join(', ')}</p>}
          {p.meds.stat.length > 0 && <p><span style={{ color: SLATE }}>Stat:</span> {p.meds.stat.map((m) => m.name + (m.dose ? ` ${m.dose}` : '') + (m.frequency ? ` ${m.frequency}` : '')).join(', ')}</p>}
          {p.meds.regular.length > 0 && <p><span style={{ color: SLATE }}>Regular:</span> {p.meds.regular.map((m) => m.name + (m.dose ? ` ${m.dose}` : '') + (m.frequency ? ` ${m.frequency}` : '')).join(', ')}</p>}
          {p.meds.antibiotics.length > 0 && <p><span style={{ color: SLATE }}>Antibiotics:</span> {p.meds.antibiotics.map((a) => `${a.name}${a.dose ? ' ' + a.dose : ''} (Day ${dayCount(a.startDate)})`).join(', ')}</p>}
          {p.meds.prn.length === 0 && p.meds.stat.length === 0 && p.meds.regular.length === 0 && p.meds.antibiotics.length === 0 && <p style={{ color: SLATE }}>No medications recorded</p>}
        </div>
      </ViewSection>

      <ViewSection icon={Users} color="#C2578B" label="Consultations">
        {(p.consultations || []).length === 0 ? <p className="text-sm" style={{ color: SLATE }}>No consultations requested</p> : (
          <div className="space-y-2.5">
            {p.consultations.map((c) => (
              <div key={c.id}>
                <p className="text-sm font-semibold" style={{ color: INK }}>{c.specialty} <span className="font-normal" style={{ color: SLATE }}>· requested {fmtDMY(c.requestedDate)}</span></p>
                <p className="text-sm" style={{ color: SLATE }}>{c.notes || 'Awaiting response'}</p>
              </div>
            ))}
          </div>
        )}
      </ViewSection>

      <ViewSection icon={FileText} color="#6B7280" label="Progress notes">
        {(p.progressNotes || []).length === 0 ? <p className="text-sm" style={{ color: SLATE }}>No progress notes yet</p> : (
          <div className="space-y-2">
            {[...p.progressNotes].reverse().map((n) => (
              <div key={n.id}>
                <p className="text-[11px] font-semibold" style={{ color: SLATE }}>{fmtDMY(n.date)}</p>
                <p className="text-sm" style={{ color: INK }}>{n.text}</p>
              </div>
            ))}
          </div>
        )}
      </ViewSection>

      <ViewSection icon={Check} color={GREEN} label="Plan">
        <p className="text-sm font-semibold mb-1.5" style={{ color: p.plan.isDischarge ? GREEN : INK }}>{p.plan.isDischarge ? 'Discharge' : 'Continue stay'}</p>
        {allPlanItems.length === 0 ? <p className="text-sm" style={{ color: SLATE }}>No plan items yet</p> : (
          <ul className="space-y-1 text-sm list-disc pl-4" style={{ color: INK }}>
            {allPlanItems.map((item, i) => <li key={i}>{item}</li>)}
          </ul>
        )}
      </ViewSection>
    </div>
    <ImageLightbox src={lightbox} onClose={() => setLightbox(null)} />
    </>
  );
}

/* --- Vitals Tab --- */
function VitalsTab({ draft, update }) {
  const v = draft.vitals || { stable: true, hr: '', bp: '', rr: '', temp: '', spo2: '', rbg: '' };
  const setVital = (patch) => update({ vitals: { ...v, ...patch } });
  const log = draft.vitalsLog || [];

  const addReading = () => {
    const hasAny = v.hr || v.bp || v.rr || v.temp || v.spo2 || v.rbg;
    if (!hasAny) return;
    const entry = { id: uid(), date: todayISO(), hr: v.hr, bp: v.bp, rr: v.rr, temp: v.temp, spo2: v.spo2, rbg: v.rbg };
    update({
      vitalsLog: [...log, entry],
      vitals: { ...v, hr: '', bp: '', rr: '', temp: '', spo2: '', rbg: '' }
    });
  };
  const removeReading = (id) => update({ vitalsLog: log.filter((r) => r.id !== id) });

  return (
    <div className="space-y-4">
      <div className="flex gap-2">
        <button onClick={() => setVital({ stable: true })} className="flex-1 px-3 py-2.5 rounded-lg text-sm font-semibold border"
          style={v.stable ? { background: GREEN, borderColor: GREEN, color: '#fff' } : { borderColor: LINE, color: SLATE }}>
          Vitally stable
        </button>
        <button onClick={() => setVital({ stable: false })} className="flex-1 px-3 py-2.5 rounded-lg text-sm font-semibold border"
          style={!v.stable ? { background: RED, borderColor: RED, color: '#fff' } : { borderColor: LINE, color: SLATE }}>
          Not stable
        </button>
      </div>

      {log.length > 0 && (
        <div>
          <p className="text-xs font-semibold uppercase tracking-wide mb-2" style={{ color: SLATE }}>Readings</p>
          <div className="space-y-2">
            {[...log].reverse().map((r) => (
              <div key={r.id} className="border rounded-lg px-3 py-2.5" style={{ borderColor: LINE }}>
                <div className="flex items-center justify-between mb-0.5">
                  <span className="text-[11px] font-semibold" style={{ color: SLATE }}>{fmtDMY(r.date)}</span>
                  <button onClick={() => removeReading(r.id)}><Trash2 size={13} color={SLATE} /></button>
                </div>
                <p className="text-sm font-mono" style={{ color: INK }}>
                  {[r.hr && `HR ${r.hr}`, r.bp && `BP ${r.bp}`, r.rr && `RR ${r.rr}`, r.temp && `Temp ${r.temp}`, r.spo2 && `SpO2 ${r.spo2}`, r.rbg && `RBG ${r.rbg}`].filter(Boolean).join(' · ')}
                </p>
              </div>
            ))}
          </div>
        </div>
      )}

      <div>
        <p className="text-xs font-semibold uppercase tracking-wide mb-2" style={{ color: SLATE }}>Add a reading</p>
        <div className="space-y-2">
          <input value={v.hr} onChange={(e) => setVital({ hr: e.target.value })} placeholder="Heart rate (bpm)" className="w-full border rounded-lg px-3 py-2 text-sm" style={{ borderColor: LINE, boxSizing: 'border-box' }} />
          <input value={v.bp} onChange={(e) => setVital({ bp: e.target.value })} placeholder="Blood pressure e.g. 120/80" className="w-full border rounded-lg px-3 py-2 text-sm" style={{ borderColor: LINE, boxSizing: 'border-box' }} />
          <input value={v.rr} onChange={(e) => setVital({ rr: e.target.value })} placeholder="Resp. rate (/min)" className="w-full border rounded-lg px-3 py-2 text-sm" style={{ borderColor: LINE, boxSizing: 'border-box' }} />
          <input value={v.temp} onChange={(e) => setVital({ temp: e.target.value })} placeholder="Temperature (°C)" className="w-full border rounded-lg px-3 py-2 text-sm" style={{ borderColor: LINE, boxSizing: 'border-box' }} />
          <input value={v.spo2} onChange={(e) => setVital({ spo2: e.target.value })} placeholder="SpO2 (%)" className="w-full border rounded-lg px-3 py-2 text-sm" style={{ borderColor: LINE, boxSizing: 'border-box' }} />
          <input value={v.rbg} onChange={(e) => setVital({ rbg: e.target.value })} placeholder="Random blood glucose (mmol/L)" className="w-full border rounded-lg px-3 py-2 text-sm" style={{ borderColor: LINE, boxSizing: 'border-box' }} />
          <button onClick={addReading} className="w-full px-3 py-2 rounded-lg text-sm font-semibold text-white" style={{ background: '#2CA6A4' }}>+ Add reading</button>
        </div>
      </div>
    </div>
  );
}

    update({ seenToday: { ...seenToday, items: has ? seenToday.items.filter((x) => x !== item) : [...seenToday.items, item] } });

  return (
    <Field label="Seen today">

/* --- Labs Tab --- */
function LabsTab({ draft, update, showToast }) {
  const [newLabName, setNewLabName] = useState(LAB_PRESETS[0]);
  const [customLabName, setCustomLabName] = useState('');
  const [newLabValue, setNewLabValue] = useState('');
  const [quickValues, setQuickValues] = useState({}); // { [labName]: value }
  const [ocrBusy, setOcrBusy] = useState(false);
  const fileRef = useRef(null);

  const addLabValue = (name, value, date = todayISO()) => {
    if (!name || value === '' || value === undefined || value === null) return;
    const labs = { ...draft.labs };
    const arr = labs[name] ? [...labs[name]] : [];
    arr.push({ date, value: String(value) });
    labs[name] = arr;
    update({ labs });
  };

  const handleManualAdd = () => {
    const finalName = newLabName === 'Other' ? customLabName.trim() : newLabName;
    if (!finalName) return;
    addLabValue(finalName, newLabValue);
    setNewLabValue('');
    if (newLabName === 'Other') setCustomLabName('');
  };

  const handleQuickAdd = (name) => {
    const val = quickValues[name];
    if (!val) return;
    addLabValue(name, val);
    setQuickValues((prev) => ({ ...prev, [name]: '' }));
  };

  const handlePhotoOCR = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setOcrBusy(true);
    try {
      const dataUrl = await fileToResizedDataUrl(file);
      const instruction = 'This image shows a lab results report or a hospital-system screenshot. Extract every lab test and its most recent/current numeric value. Respond ONLY with JSON, nothing else, in this exact shape: {"labs":[{"name":"WBC","value":"9.4"}]}. Use these short names when the test matches: WBC, Hb, Plt, Na, K, Urea, Creatinine, CRP, Bilirubin, ALT, AST, Amylase, Lipase, Lactate, INR — otherwise use the label as printed.';
      const result = await callClaudeVision(dataUrl, instruction);
      if (result && Array.isArray(result.labs) && result.labs.length) {
        result.labs.forEach((l) => addLabValue(l.name, l.value));
        showToast(`Extracted ${result.labs.length} lab value(s)`);
      } else {
        showToast('Could not read labs from that photo — try manual entry');
      }
    } catch (err) {
      showToast('OCR failed — try manual entry');
    } finally {
      setOcrBusy(false);
      if (fileRef.current) fileRef.current.value = '';
    }
  };

  const labNames = Object.keys(draft.labs);

  return (
    <div className="space-y-4">
      <div>
        <p className="text-xs font-semibold uppercase tracking-wide mb-2" style={{ color: SLATE }}>Trends</p>
        <label className="flex items-center justify-center gap-1.5 text-xs font-semibold px-3 py-2.5 rounded-lg border cursor-pointer w-full" style={{ borderColor: LINE, color: ACCENT }}>
          {ocrBusy ? <Loader2 size={13} className="animate-spin" /> : <Camera size={13} />}
          {ocrBusy ? 'Reading photo…' : 'Photo of labs'}
          <input ref={fileRef} type="file" accept="image/*" capture="environment" className="hidden" onChange={handlePhotoOCR} disabled={ocrBusy} />
        </label>
      </div>

      {labNames.length === 0 && <p className="text-sm" style={{ color: SLATE }}>No labs recorded yet.</p>}

      <div className="space-y-3">
        {labNames.map((name) => {
          const arr = draft.labs[name];
          return (
            <div key={name} className="border rounded-lg px-3 py-2.5" style={{ borderColor: LINE }}>
              <div className="flex items-center justify-between mb-1.5">
                <span className="font-semibold text-sm" style={{ color: INK }}>{name}</span>
                <button onClick={() => { const labs = { ...draft.labs }; delete labs[name]; update({ labs }); }}>
                  <Trash2 size={13} color={SLATE} />
                </button>
              </div>
              <div className="flex items-center flex-wrap gap-1.5 font-mono text-sm mb-2.5">
                {arr.map((entry, i) => {
                  const isLast = i === arr.length - 1;
                  const abnormal = isAbnormal(name, entry.value);
                  return (
                    <React.Fragment key={i}>
                      {i > 0 && <span style={{ color: SLATE }}>›</span>}
                      <span
                        className="px-2 py-0.5 rounded font-semibold"
                        style={isLast
                          ? { background: abnormal ? RED : ACCENT, color: '#fff' }
                          : { background: abnormal ? '#FBE7EA' : '#EEF0F5', color: abnormal ? RED : SLATE }}
                      >
                        {entry.value}
                      </span>
                    </React.Fragment>
                  );
                })}
              </div>
              <div className="space-y-1.5">
                <input
                  value={quickValues[name] || ''}
                  onChange={(e) => setQuickValues((prev) => ({ ...prev, [name]: e.target.value }))}
                  onKeyDown={(e) => e.key === 'Enter' && handleQuickAdd(name)}
                  placeholder="Add another reading (even same day)"
                  className="w-full border rounded-lg px-3 py-2 text-sm"
                  style={{ borderColor: LINE, boxSizing: 'border-box' }}
                />
                <button onClick={() => handleQuickAdd(name)} className="w-full px-3 py-2 rounded-lg text-xs font-semibold" style={{ background: PAPER, color: ACCENT }}>
                  + Add to {name}
                </button>
              </div>
            </div>
          );
        })}
      </div>

      <div className="border rounded-lg p-3 space-y-2.5" style={{ borderColor: LINE, background: PAPER }}>
        <p className="text-xs font-semibold uppercase tracking-wide" style={{ color: SLATE }}>Add a new lab</p>
        <select value={newLabName} onChange={(e) => setNewLabName(e.target.value)} className="w-full border rounded-lg px-2 py-2 text-sm" style={{ borderColor: LINE, boxSizing: 'border-box' }}>
          {LAB_PRESETS.map((n) => <option key={n} value={n}>{n}</option>)}
          <option value="Other">Other…</option>
        </select>
        {newLabName === 'Other' && (
          <input value={customLabName} onChange={(e) => setCustomLabName(e.target.value)} placeholder="Lab name" className="w-full border rounded-lg px-3 py-2 text-sm" style={{ borderColor: LINE, boxSizing: 'border-box' }} />
        )}
        <input value={newLabValue} onChange={(e) => setNewLabValue(e.target.value)} placeholder="Value" className="w-full border rounded-lg px-3 py-2 text-sm" style={{ borderColor: LINE, boxSizing: 'border-box' }} />
        <button onClick={handleManualAdd} className="w-full px-3 py-2 rounded-lg text-sm font-semibold text-white" style={{ background: ACCENT }}>Add lab</button>
      </div>

      <CultureSection draft={draft} update={update} />
    </div>
  );
}

/* --- Culture Results --- */
function CultureSection({ draft, update }) {
  const cultures = draft.cultures || [];
  const [specimen, setSpecimen] = useState(CULTURE_SPECIMEN_TYPES[0]);
  const [customSpecimen, setCustomSpecimen] = useState('');
  const [dateSent, setDateSent] = useState(todayISO());
  const [result, setResult] = useState('pending'); // 'pending' | 'no_growth' | 'positive'
  const [organism, setOrganism] = useState('');
  const [sensitiveTo, setSensitiveTo] = useState('');
  const [resistantTo, setResistantTo] = useState('');

  const addCulture = () => {
    const finalSpecimen = specimen === 'Other' ? customSpecimen.trim() : specimen;
    if (!finalSpecimen) return;
    const entry = { id: uid(), specimen: finalSpecimen, dateSent, result, organism, sensitiveTo, resistantTo };
    update({ cultures: [...cultures, entry] });
    setResult('pending'); setOrganism(''); setSensitiveTo(''); setResistantTo(''); setDateSent(todayISO());
    if (specimen === 'Other') setCustomSpecimen('');
  };
  const removeCulture = (id) => update({ cultures: cultures.filter((c) => c.id !== id) });
  const updateCulture = (id, patch) => update({ cultures: cultures.map((c) => (c.id === id ? { ...c, ...patch } : c)) });

  const resultLabel = (r) => r === 'no_growth' ? 'No growth' : r === 'positive' ? 'Organism isolated' : 'Pending';
  const resultColor = (r) => r === 'no_growth' ? GREEN : r === 'positive' ? RED : AMBER;

  return (
    <div>
      <p className="text-xs font-semibold uppercase tracking-wide mb-2 mt-1" style={{ color: SLATE }}>Culture results</p>

      {cultures.length > 0 && (
        <div className="space-y-2.5 mb-3">
          {[...cultures].reverse().map((c) => (
            <div key={c.id} className="border rounded-lg p-3" style={{ borderColor: LINE }}>
              <div className="flex items-center justify-between mb-1">
                <span className="font-semibold text-sm" style={{ color: INK }}>{c.specimen} culture</span>
                <button onClick={() => removeCulture(c.id)}><Trash2 size={13} color={SLATE} /></button>
              </div>
              <p className="text-[11px] mb-1.5" style={{ color: SLATE }}>Sent {fmtDMY(c.dateSent)}</p>
              <div className="flex gap-1.5 mb-2">
                {['pending', 'no_growth', 'positive'].map((r) => (
                  <button key={r} onClick={() => updateCulture(c.id, { result: r })} className="px-2.5 py-1 rounded-full text-[11px] font-semibold border"
                    style={c.result === r ? { background: resultColor(r), borderColor: resultColor(r), color: '#fff' } : { borderColor: LINE, color: SLATE }}>
                    {resultLabel(r)}
                  </button>
                ))}
              </div>
              {c.result === 'positive' && (
                <div className="space-y-1.5">
                  <input value={c.organism} onChange={(e) => updateCulture(c.id, { organism: e.target.value })} placeholder="Organism isolated" className="w-full border rounded-lg px-3 py-2 text-sm" style={{ borderColor: LINE, boxSizing: 'border-box' }} />

/* --- Imaging Tab --- */
function ImagingTab({ draft, update, showToast }) {
  const [type, setType] = useState(IMAGING_TYPES[0]);
  const [findings, setFindings] = useState('');
  const [image, setImage] = useState(null);
  const [ocrBusy, setOcrBusy] = useState(false);
  const [lightbox, setLightbox] = useState(null);
  const fileRef = useRef(null);

  const handlePhoto = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const dataUrl = await fileToResizedDataUrl(file);
    setImage(dataUrl);
  };

  const extractFindings = async () => {
    if (!image) return;
    setOcrBusy(true);
    try {
      const instruction = 'This image shows a radiology report. Extract the findings and impression, combined into one concise clinical summary suitable for a ward round note. Respond ONLY with JSON, nothing else: {"findings":"..."}';
      const result = await callClaudeVision(image, instruction);
      if (result && result.findings) { setFindings(result.findings); showToast('Findings extracted'); }
      else showToast('Could not read the report — try typing findings manually');
    } catch (e) { showToast('OCR failed — try manual entry'); }
    finally { setOcrBusy(false); }
  };

  const addEntry = () => {
    if (!type) return;
    const entry = { id: uid(), type, findings, image };
    update({ imaging: [...draft.imaging, entry] });
    setFindings(''); setImage(null); setType(IMAGING_TYPES[0]);
    if (fileRef.current) fileRef.current.value = '';
  };

  const removeEntry = (id) => update({ imaging: draft.imaging.filter((im) => im.id !== id) });

  return (
    <>
    <div className="space-y-4">
      {draft.imaging.length > 0 && (
        <div className="space-y-2.5">
          {draft.imaging.map((im) => (
            <div key={im.id} className="border rounded-lg p-3 flex gap-3" style={{ borderColor: LINE }}>
              {im.image && <img src={im.image} onClick={() => setLightbox(im.image)} className="w-16 h-16 object-cover rounded-md shrink-0 cursor-pointer" alt={im.type} />}
              <div className="flex-1 min-w-0">
                <div className="flex items-center justify-between">
                  <span className="font-semibold text-sm" style={{ color: INK }}>{im.type}</span>
                  <button onClick={() => removeEntry(im.id)}><Trash2 size={13} color={SLATE} /></button>
                </div>
                <p className="text-xs mt-0.5" style={{ color: SLATE }}>{im.findings || 'No findings noted'}</p>
              </div>
            </div>
          ))}
        </div>
      )}

      <div className="border rounded-lg p-3 space-y-2.5" style={{ borderColor: LINE, background: PAPER }}>
        <p className="text-xs font-semibold uppercase tracking-wide" style={{ color: SLATE }}>Add imaging</p>
        <select value={type} onChange={(e) => setType(e.target.value)} className="w-full border rounded-lg px-3 py-2 text-sm" style={{ borderColor: LINE }}>
          {IMAGING_TYPES.map((t) => <option key={t} value={t}>{t}</option>)}
        </select>

        <div className="space-y-2">
          <label className="flex items-center justify-center gap-1.5 text-xs font-semibold px-3 py-2.5 rounded-lg border cursor-pointer w-full" style={{ borderColor: LINE, color: ACCENT, background: '#fff' }}>
            <Camera size={13} /> {image ? 'Retake photo' : 'Photo of report/image'}
            <input ref={fileRef} type="file" accept="image/*" capture="environment" className="hidden" onChange={handlePhoto} />
          </label>
          {image && (
            <button onClick={extractFindings} disabled={ocrBusy} className="flex items-center justify-center gap-1.5 text-xs font-semibold px-3 py-2.5 rounded-lg text-white w-full" style={{ background: ACCENT }}>
              {ocrBusy ? <Loader2 size={13} className="animate-spin" /> : <ImageIcon size={13} />}
              {ocrBusy ? 'Extracting…' : 'Extract findings'}
            </button>
          )}
        </div>
        {image && <img src={image} className="w-20 h-20 object-cover rounded-md" alt="preview" />}

        <textarea value={findings} onChange={(e) => setFindings(e.target.value)} placeholder="Findings / impression" rows={2} className="w-full border rounded-lg px-3 py-2 text-sm" style={{ borderColor: LINE }} />
        <button onClick={addEntry} className="w-full px-3 py-2 rounded-lg text-sm font-semibold text-white" style={{ background: INK }}>Add imaging entry</button>
      </div>
    </div>
    <ImageLightbox src={lightbox} onClose={() => setLightbox(null)} />
    </>
  );
}

function MedGroup({ group, label, presets, entries, setEntries, favoriteMeds, onAddFavoriteMed, onRemoveFavoriteMed, color, hasStartDate }) {
  const [customName, setCustomName] = useState('');
  const groupFavorites = (favoriteMeds || []).filter((f) => f.group === group);

  const addEntry = (name, dose = '', frequency = '') => {
    if (!name) return;
    const entry = { id: uid(), name, dose, frequency };
    if (hasStartDate) entry.startDate = todayISO();
    setEntries([...entries, entry]);
  };
  const addCustom = () => {
    const name = customName.trim();
    if (!name) return;
    addEntry(name);
    setCustomName('');
  };
  const updateEntry = (id, patch) => setEntries(entries.map((e) => (e.id === id ? { ...e, ...patch } : e)));
  const removeEntry = (id) => setEntries(entries.filter((e) => e.id !== id));
  const saveFavorite = (entry) => onAddFavoriteMed({ name: entry.name, dose: entry.dose, frequency: entry.frequency, group });

  return (
    <div>
      <p className="text-xs font-semibold uppercase tracking-wide mb-2" style={{ color: SLATE }}>{label}</p>

      {entries.length > 0 && (
        <div className="space-y-2.5 mb-3">
          {entries.map((e) => (
            <div key={e.id} className="border rounded-lg p-3" style={{ borderColor: LINE }}>
              <div className="flex items-center justify-between mb-2">
                <span className="font-semibold text-sm flex items-center gap-1.5" style={{ color: INK }}>
                  <Pill size={13} color={color} /> {e.name}{hasStartDate ? ` — Day ${dayCount(e.startDate)}` : ''}
                </span>
                <button onClick={() => removeEntry(e.id)}><Trash2 size={13} color={SLATE} /></button>
              </div>
              <div className="space-y-1.5">
                {hasStartDate && (
                  <input type="date" value={e.startDate} onChange={(ev) => updateEntry(e.id, { startDate: ev.target.value })} className="border rounded-lg px-3 py-2 text-sm" style={{ borderColor: LINE, width: '100%', boxSizing: 'border-box' }} />
                )}
                <input value={e.dose} onChange={(ev) => updateEntry(e.id, { dose: ev.target.value })} placeholder="Dose (optional)" className="w-full border rounded-lg px-3 py-2 text-sm" style={{ borderColor: LINE, boxSizing: 'border-box' }} />
                <input value={e.frequency} onChange={(ev) => updateEntry(e.id, { frequency: ev.target.value })} placeholder="Frequency (optional)" className="w-full border rounded-lg px-3 py-2 text-sm" style={{ borderColor: LINE, boxSizing: 'border-box' }} />
                <button onClick={() => saveFavorite(e)} className="w-full flex items-center justify-center gap-1.5 px-3 py-2 rounded-lg text-xs font-semibold" style={{ background: PAPER, color: AMBER }}>
                  <Star size={12} /> Save as favorite
                </button>
              </div>
            </div>
          ))}
        </div>
      )}

      <div className="flex flex-wrap gap-2 mb-2">
        {presets.map((n) => <Chip key={n} active={false} onClick={() => addEntry(n)}>{n}</Chip>)}
      </div>

      {groupFavorites.length > 0 && (
        <div className="flex flex-wrap gap-2 mb-2">
          {groupFavorites.map((f) => (
            <div key={f.id} className="flex items-center gap-1">
              <button onClick={() => addEntry(f.name, f.dose, f.frequency)} className="px-3 py-1.5 rounded-full text-xs font-medium border flex items-center gap-1" style={{ borderColor: AMBER, color: AMBER, background: '#FEF6E9' }}>
                <Star size={11} /> {f.name}{f.dose ? ` ${f.dose}` : ''}
              </button>
              <button onClick={() => onRemoveFavoriteMed(f.id)}><X size={12} color={SLATE} /></button>
            </div>
          ))}
        </div>
      )}

      <div className="space-y-1.5">
        <input
          value={customName}
          onChange={(e) => setCustomName(e.target.value)}
          onKeyDown={(e) => e.key === 'Enter' && addCustom()}
          placeholder={`Add another ${label.toLowerCase()} medication`}
          className="w-full border rounded-lg px-3 py-2 text-sm"
          style={{ borderColor: LINE, boxSizing: 'border-box' }}
        />
        <button onClick={addCustom} className="w-full px-3 py-2 rounded-lg text-xs font-semibold text-white" style={{ background: INK }}>Add</button>
      </div>
    </div>
  );
}

/* --- Plan Tab --- */
function PlanTab({ draft, update }) {
  const [customText, setCustomText] = useState('');
  const entries = planEntries(draft.plan);
  const setEntries = (next) => update({ plan: { isDischarge: draft.plan.isDischarge, entries: next } });

  const setDischarge = (val) => update({ plan: { isDischarge: val, entries: [] } });

  const toggleItem = (text) => {
    const idx = entries.findIndex((e) => e.text === text);
    if (idx > -1) setEntries(entries.filter((_, i) => i !== idx));
    else setEntries([...entries, { id: uid(), text }]);
  };

  const addCustomItem = () => {
    const text = customText.trim();
    if (!text) return;
    setEntries([...entries, { id: uid(), text }]);
    setCustomText('');
  };

  const removeEntry = (id) => setEntries(entries.filter((e) => e.id !== id));

  const moveEntry = (index, dir) => {
    const target = index + dir;
    if (target < 0 || target >= entries.length) return;
    const next = [...entries];
    [next[index], next[target]] = [next[target], next[index]];
    setEntries(next);
  };

  const presets = draft.plan.isDischarge ? DISCHARGE_PLAN_PRESETS : STAY_PLAN_PRESETS;
  const entryTexts = entries.map((e) => e.text);

  return (
    <div className="space-y-4">
      <div className="flex gap-2">
        <button onClick={() => setDischarge(false)} className="flex-1 px-3 py-2.5 rounded-lg text-sm font-semibold border"
          style={!draft.plan.isDischarge ? { background: INK, borderColor: INK, color: '#fff' } : { borderColor: LINE, color: SLATE }}>
          Continue stay
        </button>
        <button onClick={() => setDischarge(true)} className="flex-1 px-3 py-2.5 rounded-lg text-sm font-semibold border"
          style={draft.plan.isDischarge ? { background: GREEN, borderColor: GREEN, color: '#fff' } : { borderColor: LINE, color: SLATE }}>
          Discharge plan
        </button>
      </div>

      <div className="flex flex-wrap gap-2">
        {presets.map((item) => <Chip key={item} active={entryTexts.includes(item)} onClick={() => toggleItem(item)}>{item}</Chip>)}
      </div>

      <Field label="Add your own plan point">
        <div className="space-y-1.5">
          <input
            value={customText}
            onChange={(e) => setCustomText(e.target.value)}
            onKeyDown={(e) => e.key === 'Enter' && addCustomItem()}
            placeholder="Type a plan point and add"
            className="w-full border rounded-lg px-3 py-2 text-sm"
            style={{ borderColor: LINE, boxSizing: 'border-box' }}
          />
          <button onClick={addCustomItem} className="w-full px-3 py-2 rounded-lg text-sm font-semibold text-white" style={{ background: ACCENT }}>Add</button>
        </div>
      </Field>

      {entries.length > 0 && (
        <div>
          <p className="text-xs font-semibold uppercase tracking-wide mb-2" style={{ color: SLATE }}>Today's plan — drag order with the arrows</p>
          <div className="space-y-1.5">
            {entries.map((e, i) => (
              <div key={e.id} className="flex items-center gap-2 border rounded-lg px-3 py-2 text-sm" style={{ borderColor: LINE }}>
                <span className="font-mono text-xs shrink-0" style={{ color: SLATE }}>{i + 1}.</span>
                <span className="flex-1" style={{ color: INK }}>{e.text}</span>
                <button onClick={() => moveEntry(i, -1)} disabled={i === 0} className="shrink-0" style={{ opacity: i === 0 ? 0.3 : 1 }}><ChevronUp size={15} color={SLATE} /></button>
                <button onClick={() => moveEntry(i, 1)} disabled={i === entries.length - 1} className="shrink-0" style={{ opacity: i === entries.length - 1 ? 0.3 : 1 }}><ChevronDown size={15} color={SLATE} /></button>
                <button onClick={() => removeEntry(e.id)} className="shrink-0"><X size={14} color={SLATE} /></button>
              </div>
            ))}
          </div>
        </div>
      )}

      <p className="text-[11px] leading-relaxed p-3 rounded-lg" style={{ background: PAPER, color: SLATE }}>
        Note: setting a discharge plan here only records today's plan — it does not remove the patient. Use "Discharge patient" below to actually take them off the round list once they've left.
      </p>
    </div>
  );
}

/* ---------------- Export Modal ---------------- */
function ExportModal({ consultants, onClose, onConfirm }) {
  const [selected, setSelected] = useState(consultants.map((c) => c.id));
  const [mode, setMode] = useState('summary');

  const toggle = (id) => setSelected((prev) => prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]);

  return (
    <div className="fixed inset-0 z-40 flex items-end sm:items-center justify-center bg-black/40 p-0 sm:p-4">
      <div className="bg-white w-full sm:max-w-md sm:rounded-2xl rounded-t-2xl overflow-hidden">
        <div className="flex items-center justify-between px-4 py-3 border-b" style={{ borderColor: LINE }}>
          <h2 className="font-display font-semibold text-base" style={{ color: INK }}>Export round PDF</h2>
          <button onClick={onClose}><X size={18} color={SLATE} /></button>
        </div>
        <div className="px-4 py-4 space-y-4">
          <div>
            <p className="text-xs font-semibold uppercase tracking-wide mb-2" style={{ color: SLATE }}>Consultants to include</p>
            <div className="flex flex-wrap gap-2">
              {consultants.map((c) => <Chip key={c.id} active={selected.includes(c.id)} onClick={() => toggle(c.id)}>{c.name}</Chip>)}
            </div>
          </div>
          <div>
            <p className="text-xs font-semibold uppercase tracking-wide mb-2" style={{ color: SLATE }}>Content</p>
            <div className="flex gap-2">
              <button onClick={() => setMode('summary')} className="flex-1 px-3 py-2 rounded-lg text-sm font-semibold border" style={mode === 'summary' ? { background: INK, borderColor: INK, color: '#fff' } : { borderColor: LINE, color: SLATE }}>Full summary</button>
              <button onClick={() => setMode('plan')} className="flex-1 px-3 py-2 rounded-lg text-sm font-semibold border" style={mode === 'plan' ? { background: INK, borderColor: INK, color: '#fff' } : { borderColor: LINE, color: SLATE }}>Plans only</button>
            </div>
          </div>
        </div>
        <div className="px-4 py-3 border-t flex justify-end gap-2" style={{ borderColor: LINE }}>
          <button onClick={onClose} className="px-4 py-2 rounded-lg text-sm font-medium border" style={{ borderColor: LINE, color: INK }}>Cancel</button>
          <button onClick={() => onConfirm({ selected, mode })} disabled={selected.length === 0} className="px-4 py-2 rounded-lg text-sm font-semibold text-white flex items-center gap-1.5" style={{ background: ACCENT, opacity: selected.length === 0 ? 0.5 : 1 }}>
            <FileText size={14} /> Generate PDF
          </button>
        </div>
      </div>
    </div>
  );
}

/* ---------------- Confirm Modal ---------------- */
function ConfirmModal({ title, message, confirmLabel, danger, onCancel, onConfirm }) {
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
      <div className="bg-white w-full max-w-sm rounded-2xl p-5">
        <div className="w-10 h-10 rounded-full flex items-center justify-center mb-3" style={{ background: danger ? '#FBE7EA' : PAPER }}>
          <AlertTriangle size={18} color={danger ? RED : INK} />
        </div>
        <h3 className="font-display font-semibold text-base mb-1.5" style={{ color: INK }}>{title}</h3>
        <p className="text-sm mb-5" style={{ color: SLATE }}>{message}</p>
        <div className="flex gap-2">
          <button onClick={onCancel} className="flex-1 px-4 py-2.5 rounded-lg text-sm font-medium border" style={{ borderColor: LINE, color: INK }}>Cancel</button>
          <button onClick={onConfirm} className="flex-1 px-4 py-2.5 rounded-lg text-sm font-semibold text-white" style={{ background: danger ? RED : ACCENT }}>{confirmLabel}</button>
        </div>
      </div>
    </div>
  );
}

/* ---------------- Print View ---------------- */
function PrintView({ config, patients, consultants }) {
  const included = consultants.filter((c) => config.selected.includes(c.id));
  const dateStr = new Date().toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' }).replace(/\//g, '.');

  const medsLine = (p) => {
    const parts = [];
    if (p.meds.prn.length) parts.push(`PRN: ${p.meds.prn.map((m) => m.name + (m.dose ? ' ' + m.dose : '')).join(', ')}`);
    if (p.meds.stat.length) parts.push(`Stat: ${p.meds.stat.map((m) => m.name + (m.dose ? ' ' + m.dose : '')).join(', ')}`);
    if (p.meds.regular.length) parts.push(`Regular: ${p.meds.regular.map((m) => m.name + (m.dose ? ' ' + m.dose : '')).join(', ')}`);
    if (p.meds.antibiotics.length) parts.push(`Antibiotics: ${p.meds.antibiotics.map((a) => `${a.name} (Day ${dayCount(a.startDate)})`).join(', ')}`);
    return parts;
  };

  const SectionLabel = ({ color, children }) => (
    <p style={{ fontSize: 9.5, fontWeight: 700, color, textTransform: 'uppercase', letterSpacing: 0.4, marginBottom: 1 }}>{children}</p>
  );

  return (
    <div className="print-only" style={{ fontFamily: 'Inter, sans-serif', color: '#111' }}>
      <div style={{ background: INK, color: '#fff', padding: '18px 24px', marginBottom: 18 }}>
        <h1 style={{ fontSize: 21, fontWeight: 700, margin: 0 }}>Morning Round</h1>
        <p style={{ fontSize: 12.5, opacity: 0.8, margin: '2px 0 0' }}>{dateStr} · {config.mode === 'summary' ? 'Full summary' : 'Plans only'}</p>
      </div>

      <div style={{ padding: '0 24px 24px' }}>
        {included.map((c) => {
          const pts = patients.filter((p) => p.consultantId === c.id).sort(sortByWardBed);
          if (pts.length === 0) return null;
          return (
            <div key={c.id} style={{ marginBottom: 22 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, borderBottom: `2px solid ${c.color}`, paddingBottom: 5, marginBottom: 12 }}>
                <span style={{ width: 10, height: 10, borderRadius: 999, background: c.color, display: 'inline-block' }} />
                <h2 style={{ fontSize: 14.5, fontWeight: 700, margin: 0, color: INK }}>{c.name}</h2>
              </div>

              {pts.map((p) => (
                <div key={p.id} style={{ border: `1px solid ${LINE}`, borderLeft: `4px solid ${c.color}`, borderRadius: 6, padding: '10px 12px', marginBottom: 10, pageBreakInside: 'avoid' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: config.mode === 'summary' ? 6 : 3 }}>
                    <span style={{ fontFamily: 'IBM Plex Mono, monospace', fontSize: 13, fontWeight: 700, color: INK }}>{p.ward}/{p.bed}</span>
                    <span style={{ fontSize: 12.5, fontWeight: 600, color: INK }}>{p.diagnosis}</span>
                    <span style={{ fontSize: 9, fontWeight: 700, padding: '1.5px 6px', borderRadius: 4, textTransform: 'uppercase', background: p.admissionType === 'emergency' ? '#FBE7EA' : '#E9F5EA', color: p.admissionType === 'emergency' ? RED : GREEN }}>{p.admissionType}</span>
                    <span style={{ fontSize: 9.5, color: SLATE }}>Day {dayCount(p.admissionDate)}</span>
                    {p.vitals && !p.vitals.stable && (
                      <span style={{ fontSize: 9, fontWeight: 700, padding: '1.5px 6px', borderRadius: 4, background: '#FBE7EA', color: RED }}>NOT STABLE</span>
                    )}
                  </div>

                  {config.mode === 'summary' && (
                    <div style={{ fontSize: 10.5, color: '#333', lineHeight: 1.45 }}>
                      <p style={{ margin: '0 0 4px' }}>Age {p.age || '-'} · {p.comorbidities.join(', ') || 'No comorbidities noted'}{p.comorbidityOther ? `, ${p.comorbidityOther}` : ''}</p>

                      {(() => {
                        const seenItems = [...(p.seenToday?.items || []), ...((p.seenToday?.customItems || []).map((c) => c.text))];
                        return seenItems.length > 0 && (
                          <div style={{ marginBottom: 4 }}>
                            <SectionLabel color={INK}>Seen today</SectionLabel>
                            <p style={{ margin: 0 }}>{seenItems.join(', ')}</p>
                          </div>
                        );
                      })()}

                      {p.exam && (p.exam.abdomen || p.exam.pr || p.exam.others) && (
                        <div style={{ marginBottom: 4 }}>
                          <SectionLabel color={INK}>O/E</SectionLabel>
                          <p style={{ margin: 0 }}>{[p.exam.abdomen && `Abdomen: ${p.exam.abdomen}`, p.exam.pr && `PR: ${p.exam.pr}`, p.exam.others && `Others: ${p.exam.others}`].filter(Boolean).join(' · ')}</p>
                        </div>
                      )}

                      {Object.keys(p.labs).length > 0 && (
                        <div style={{ marginBottom: 4 }}>
                          <SectionLabel color={ACCENT}>Labs</SectionLabel>
                          <p style={{ margin: 0 }}>{Object.entries(p.labs).map(([n, arr]) => `${n} ${arr[arr.length - 1].value}`).join('  ·  ')}</p>
                        </div>
                      )}

                      {(p.cultures || []).length > 0 && (
                        <div style={{ marginBottom: 4 }}>
                          <SectionLabel color={RED}>Culture results</SectionLabel>
                          <p style={{ margin: 0 }}>{p.cultures.map((c) => `${c.specimen} (${fmtDMY(c.dateSent)}): ${c.result === 'positive' ? (c.organism || 'organism isolated') + (c.sensitiveTo ? `, sensitive: ${c.sensitiveTo}` : '') + (c.resistantTo ? `, resistant: ${c.resistantTo}` : '') : c.result === 'no_growth' ? 'no growth' : 'pending'}`).join('; ')}</p>
                        </div>
                      )}

                      {p.imaging.length > 0 && (
                        <div style={{ marginBottom: 4 }}>
                          <SectionLabel color="#9C4FE0">Imaging</SectionLabel>
                          <p style={{ margin: 0 }}>{p.imaging.map((im) => `${im.type} — ${im.findings || 'pending'}`).join('; ')}</p>
                        </div>
                      )}

                      {medsLine(p).length > 0 && (
                        <div style={{ marginBottom: 4 }}>
                          <SectionLabel color={AMBER}>Medications</SectionLabel>
                          {medsLine(p).map((line, i) => <p key={i} style={{ margin: 0 }}>{line}</p>)}
                        </div>
                      )}

                      {(p.consultations || []).length > 0 && (
                        <div style={{ marginBottom: 4 }}>
                          <SectionLabel color="#C2578B">Consultations</SectionLabel>
                          <p style={{ margin: 0 }}>{p.consultations.map((c2) => `${c2.specialty}${c2.notes ? ' — ' + c2.notes : ' (pending)'}`).join('; ')}</p>
                        </div>
                      )}

                      {(p.progressNotes || []).length > 0 && (
                        <div style={{ marginBottom: 4 }}>
                          <SectionLabel color="#6B7280">Last progress note</SectionLabel>
                          <p style={{ margin: 0 }}>{p.progressNotes[p.progressNotes.length - 1].text} <span style={{ color: '#999' }}>({fmtDMY(p.progressNotes[p.progressNotes.length - 1].date)})</span></p>
                        </div>
                      )}
                    </div>
                  )}

                  <div style={{ marginTop: 4 }}>
                    <SectionLabel color={GREEN}>{p.plan.isDischarge ? 'Discharge plan' : 'Plan — continue stay'}</SectionLabel>
                    <ul style={{ margin: '2px 0 0 14px', padding: 0, fontSize: 10.5, color: '#222' }}>
                      {planEntries(p.plan).map((entry, idx) => (
                        <li key={idx} style={{ marginBottom: 1 }}>{entry.text}</li>
                      ))}
                      {planEntries(p.plan).length === 0 && <li>-</li>}
                    </ul>
                  </div>
                </div>
              ))}
            </div>
          );
        })}

        <p style={{ fontSize: 9, color: '#999', marginTop: 16, textAlign: 'right' }}>Founded by Dr. Mohamed Khamis</p>
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>
</body>
</html>
