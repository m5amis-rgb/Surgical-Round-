<script type="importmap">

    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",

  }

<body>
<div id="root"></div>
<script type="text/babel" data-type="module" data-presets="react">
import React, { useState, useEffect, useRef, useMemo } from 'react';
import ReactDOM from 'react-dom/client';
import {
  Plus, X, Check, Camera, Trash2, Edit2, FileText, Printer,
  AlertTriangle, Pill, Activity, Image as ImageIcon, Users,
  Clock, Loader2, ArrowLeft, Stethoscope, ChevronDown
} from 'lucide-react';

/* =========================================================
   DESIGN TOKENS
   Ink        #14213D  primary text / structure
   Paper      #F5F6F9  page background
   Card       #FFFFFF  surfaces
   Slate      #5C6784  secondary text
   Line       #E2E5EC  borders
   Signal Red #D6455B  abnormal / urgent / discharge-danger
   Amber      #E8A33D  emergency admission
   Green      #3F9142  routine / stable
   Accent     #2F6FED  primary actions / today's value
   Consultant palette (rotating, fixed per consultant)
   ========================================================= */

const INK = '#14213D';
const PAPER = '#F5F6F9';
const SLATE = '#5C6784';
const LINE = '#E2E5EC';
const RED = '#D6455B';
const AMBER = '#E8A33D';
const GREEN = '#3F9142';
const ACCENT = '#2F6FED';

const COLOR_PALETTE = ['#2F6FED', '#9C4FE0', '#E8A33D', '#3F9142', '#D6455B', '#2CA6A4', '#C2578B', '#6B7280'];

const COMORBIDITY_OPTIONS = [
  'Medically free', 'DM', 'HTN', 'IHD', 'CKD', 'Asthma/COPD',
  'Hypothyroidism', 'Obesity', 'Smoker', 'On anticoagulant'
];

const IMAGING_TYPES = ['X-Ray', 'CT', 'Ultrasound', 'MRI', 'Fluoroscopy', 'Other'];

const LAB_PRESETS = ['WBC', 'Hb', 'Plt', 'Na', 'K', 'Urea', 'Creatinine', 'CRP', 'Bilirubin', 'ALT', 'AST', 'Amylase', 'Lipase', 'Lactate', 'INR'];

const LAB_RANGES = {
  WBC: [4, 11], Hb: [12, 16], Plt: [150, 450], Na: [135, 145], K: [3.5, 5.1],
  Urea: [2.5, 7.1], Creatinine: [0.6, 1.3], CRP: [0, 5], Bilirubin: [0.1, 1.2],
  ALT: [7, 56], AST: [10, 40], Amylase: [30, 110], Lipase: [10, 140], Lactate: [0.5, 2.2], INR: [0.8, 1.2]
};

const PRN_MEDS = ['Pethidine', 'Phenergan', 'Paracetamol PRN', 'Tramadol'];
const STAT_MEDS = ['Cefazolin (pre-op)', 'Ondansetron'];
const REGULAR_MEDS = ['Paracetamol', 'Omeprazole', 'Clexane', 'IV Fluids'];
const ANTIBIOTIC_OPTIONS = ['Ceftriaxone', 'Metronidazole', 'Tazocin', 'Meropenem', 'Cefazolin'];

const DISCHARGE_PLAN_PRESETS = [
  'Discharge today', 'Home medications', 'OPD after 2W', 'Suture removal after 1W in LHC',
  'PRN dressing in LHC', 'Sick leave for 2W', 'Red flags explained', 'Return precautions given'
];
const STAY_PLAN_PRESETS = [
  'Daily labs + CRP', 'Start orally as tolerated', 'Decrease IVF if tolerated to 1.5L',
  'Continue antibiotics', 'Encourage mobilization', 'Encourage incentive spirometry', 'Chest physio'
];

/* ---------------- helpers ---------------- */
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const todayISO = () => new Date().toISOString().slice(0, 10);
const fmtDMY = (iso) => {
  if (!iso) return '-';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' });
};
const dayCount = (admissionISO) => {
  if (!admissionISO) return 1;
  const a = new Date(admissionISO + 'T00:00:00');
  const t = new Date(todayISO() + 'T00:00:00');
  return Math.max(1, Math.round((t - a) / 86400000) + 1);
};
const isAbnormal = (name, value) => {
  const r = LAB_RANGES[name];
  const v = parseFloat(value);
  if (!r || isNaN(v)) return false;
  return v < r[0] || v > r[1];
};
const sortByWardBed = (a, b) => {
  const parse = (s) => (s || '').split('/').map((x) => parseInt(x, 10));
  const [aw, ab] = parse(a.ward + '/' + a.bed);
  const [bw, bb] = parse(b.ward + '/' + b.bed);
  if (!isNaN(aw) && !isNaN(bw) && aw !== bw) return aw - bw;
  if (!isNaN(ab) && !isNaN(bb)) return ab - bb;
  return (a.ward + a.bed).localeCompare(b.ward + b.bed);
};

async function fileToResizedDataUrl(file, maxW = 900, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new window.Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function callClaudeVision(dataUrl, instructionText) {
  const base64 = dataUrl.split(',')[1];
  const mediaType = dataUrl.substring(5, dataUrl.indexOf(';'));
  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 1000,
      messages: [{
        role: 'user',
        content: [
          { type: 'image', source: { type: 'base64', media_type: mediaType, data: base64 } },
          { type: 'text', text: instructionText }
        ]
      }]
    })
  });
  const data = await response.json();
  const block = (data.content || []).find((b) => b.type === 'text');
  let raw = block ? block.text : '{}';
  raw = raw.replace(/```json|```/g, '').trim();
  try { return JSON.parse(raw); } catch (e) { return null; }
}

async function storageGet(key, fallback) {
  try {
    const raw = window.localStorage.getItem('surgical-round:' + key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) { return fallback; }
}
async function storageSet(key, value) {
  try { window.localStorage.setItem('surgical-round:' + key, JSON.stringify(value)); return true; }
  catch (e) { return false; }
}

const blankPatient = () => ({
  id: uid(),
  consultantId: '',
  ward: '', bed: '',
  diagnosis: '',
  admissionDate: todayISO(),
  admissionType: 'elective',
  age: '',
  comorbidities: [],
  comorbidityOther: '',
  pastSurgicalHx: '',
  erPresentation: '',
  operationDone: false,
  operationFindings: '',
  labs: {},
  imaging: [],
  meds: { prn: [], stat: [], regular: [], antibiotics: [] },
  plan: { isDischarge: false, items: [], freeText: '' },
  createdAt: todayISO()
});

/* ============================================================= */

function App() {
  const [loading, setLoading] = useState(true);
  const [consultants, setConsultants] = useState([]);
  const [patients, setPatients] = useState([]);
  const [selectedConsultants, setSelectedConsultants] = useState([]); // [] = all
  const [modalPatient, setModalPatient] = useState(null); // draft object or null
  const [isNewPatient, setIsNewPatient] = useState(false);
  const [activeTab, setActiveTab] = useState('overview');
  const [showConsultantMgr, setShowConsultantMgr] = useState(false);
  const [showExport, setShowExport] = useState(false);
  const [exportConfig, setExportConfig] = useState(null);
  const [confirmDischargeId, setConfirmDischargeId] = useState(null);
  const [toast, setToast] = useState('');

  useEffect(() => {
    (async () => {
      const c = await storageGet('consultants', []);
      const p = await storageGet('patients', []);
      setConsultants(c);
      setPatients(p);
      setLoading(false);
    })();
  }, []);

  useEffect(() => {
    if (exportConfig) {
      const t = setTimeout(() => window.print(), 150);
      return () => clearTimeout(t);
    }
  }, [exportConfig]);

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(''), 2200); };

  const saveConsultants = async (next) => { setConsultants(next); await storageSet('consultants', next); };
  const savePatients = async (next) => { setPatients(next); await storageSet('patients', next); };

  const consultantById = (id) => consultants.find((c) => c.id === id);

  const visiblePatients = useMemo(() => {
    const list = selectedConsultants.length === 0
      ? patients
      : patients.filter((p) => selectedConsultants.includes(p.consultantId));
    return [...list].sort(sortByWardBed);
  }, [patients, selectedConsultants]);

  const toggleConsultantFilter = (id) => {
    setSelectedConsultants((prev) => prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]);
  };

  const openNewPatient = () => {
    const draft = blankPatient();
    if (selectedConsultants.length === 1) draft.consultantId = selectedConsultants[0];
    setModalPatient(draft);
    setIsNewPatient(true);
    setActiveTab('overview');
  };
  const openEditPatient = (p) => {
    setModalPatient(JSON.parse(JSON.stringify(p)));
    setIsNewPatient(false);
    setActiveTab('overview');
  };
  const closeModal = () => setModalPatient(null);

  const handleSavePatient = async () => {
    if (!modalPatient.consultantId || !modalPatient.ward || !modalPatient.bed || !modalPatient.diagnosis) {
      showToast('Please fill consultant, ward, bed and diagnosis');
      return;
    }
    const exists = patients.some((p) => p.id === modalPatient.id);
    const next = exists ? patients.map((p) => (p.id === modalPatient.id ? modalPatient : p)) : [...patients, modalPatient];
    await savePatients(next);
    setModalPatient(null);
    showToast('Patient saved');
  };

  const handleDischarge = async (id) => {
    await savePatients(patients.filter((p) => p.id !== id));
    setConfirmDischargeId(null);
    setModalPatient(null);
    showToast('Patient discharged and removed');
  };

  if (loading) {
    return (
      <div style={{ background: PAPER, minHeight: '100vh' }} className="flex items-center justify-center">
        <Loader2 className="animate-spin" color={ACCENT} size={28} />
      </div>
    );
  }

  return (
    <div style={{ background: PAPER, minHeight: '100vh', fontFamily: "'Inter', system-ui, sans-serif", color: INK }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');
        .font-display { font-family: 'Space Grotesk', system-ui, sans-serif; }
        .font-mono { font-family: 'IBM Plex Mono', monospace; }
        @media print {
          .no-print { display: none !important; }
          .print-only { display: block !important; }
          body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
        .print-only { display: none; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: #C7CCDA; border-radius: 8px; }
      `}</style>

      <div className="no-print">
        <TopBar
          onAdd={openNewPatient}
          onManageConsultants={() => setShowConsultantMgr(true)}
          onExport={() => setShowExport(true)}
        />

        <ConsultantFilterBar
          consultants={consultants}
          selected={selectedConsultants}
          onToggle={toggleConsultantFilter}
          onClear={() => setSelectedConsultants([])}
        />

        <main className="max-w-4xl mx-auto px-4 pb-24 pt-4">
          {visiblePatients.length === 0 && (
            <EmptyState hasConsultants={consultants.length > 0}
              onAddConsultant={() => setShowConsultantMgr(true)}
              onAddPatient={openNewPatient} />
          )}
          <div className="space-y-3">
            {visiblePatients.map((p) => (
              <PatientCard key={p.id} patient={p} consultant={consultantById(p.consultantId)} onOpen={() => openEditPatient(p)} />
            ))}
          </div>
        </main>

        {toast && (
          <div className="fixed bottom-6 left-1/2 -translate-x-1/2 px-4 py-2 rounded-lg shadow-lg text-sm font-medium text-white z-50" style={{ background: INK }}>
            {toast}
          </div>
        )}
      </div>

      {modalPatient && (
        <PatientModal
          draft={modalPatient}
          setDraft={setModalPatient}
          consultants={consultants}
          isNew={isNewPatient}
          activeTab={activeTab}
          setActiveTab={setActiveTab}
          onClose={closeModal}
          onSave={handleSavePatient}
          onRequestDischarge={() => setConfirmDischargeId(modalPatient.id)}
          showToast={showToast}
        />
      )}

      {showConsultantMgr && (
        <ConsultantManagerModal
          consultants={consultants}
          onClose={() => setShowConsultantMgr(false)}
          onSave={saveConsultants}
        />
      )}

      {showExport && (
        <ExportModal
          consultants={consultants}
          onClose={() => setShowExport(false)}
          onConfirm={(cfg) => { setExportConfig(cfg); setShowExport(false); }}
        />
      )}

      {confirmDischargeId && (
        <ConfirmModal
          title="Discharge patient?"
          message="This will permanently remove the patient from the round list. This cannot be undone."
          confirmLabel="Discharge patient"
          danger
          onCancel={() => setConfirmDischargeId(null)}
          onConfirm={() => handleDischarge(confirmDischargeId)}
        />
      )}

      {exportConfig && (
        <PrintView
          config={exportConfig}
          patients={patients}
          consultants={consultants}
        />
      )}
    </div>
  );
}

/* ---------------- Top Bar ---------------- */
function TopBar({ onAdd, onManageConsultants, onExport }) {
  const dateStr = new Date().toLocaleDateString('en-GB', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
  return (
    <header style={{ borderBottom: `1px solid ${LINE}`, background: '#FFFFFF' }} className="sticky top-0 z-30">
      <div className="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
        <div className="flex items-center gap-2.5">
          <div style={{ background: INK }} className="w-9 h-9 rounded-lg flex items-center justify-center shrink-0">
            <Stethoscope size={18} color="#fff" />
          </div>
          <div>
            <h1 className="font-display font-semibold text-lg leading-tight" style={{ color: INK }}>Morning Round</h1>
            <p className="text-xs leading-tight" style={{ color: SLATE }}>{dateStr}</p>
            <p className="text-[10px] leading-tight mt-0.5" style={{ color: '#B8BECB' }}>Founded by Dr. Mohamed Khamis</p>
          </div>
        </div>
        <div className="flex items-center gap-2">
          <button onClick={onManageConsultants} className="hidden sm:flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-medium border" style={{ borderColor: LINE, color: INK }}>
            <Users size={15} /> Consultants
          </button>
          <button onClick={onExport} className="flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-medium border" style={{ borderColor: LINE, color: INK }}>
            <Printer size={15} /> <span className="hidden sm:inline">Export PDF</span>
          </button>
          <button onClick={onAdd} className="flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-semibold text-white" style={{ background: ACCENT }}>
            <Plus size={16} /> <span className="hidden sm:inline">Add patient</span>
          </button>
        </div>
      </div>
      <div className="sm:hidden max-w-4xl mx-auto px-4 pb-2">
        <button onClick={onManageConsultants} className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium border" style={{ borderColor: LINE, color: INK }}>
          <Users size={13} /> Manage consultants
        </button>
      </div>
    </header>
  );
}

/* ---------------- Consultant Filter Bar ---------------- */
function ConsultantFilterBar({ consultants, selected, onToggle, onClear }) {
  if (consultants.length === 0) return null;
  return (
    <div className="max-w-4xl mx-auto px-4 pt-3 flex flex-wrap gap-2">
      <button
        onClick={onClear}
        className="px-3 py-1.5 rounded-full text-xs font-semibold border"
        style={selected.length === 0
          ? { background: INK, color: '#fff', borderColor: INK }
          : { background: '#fff', color: SLATE, borderColor: LINE }}
      >
        All consultants
      </button>
      {consultants.map((c) => {
        const active = selected.includes(c.id);
        return (
          <button
            key={c.id}
            onClick={() => onToggle(c.id)}
            className="px-3 py-1.5 rounded-full text-xs font-semibold border flex items-center gap-1.5"
            style={active
              ? { background: c.color, color: '#fff', borderColor: c.color }
              : { background: '#fff', color: INK, borderColor: LINE }}
          >
            <span className="w-2 h-2 rounded-full" style={{ background: active ? '#fff' : c.color }} />
            {c.name}
          </button>
        );
      })}
    </div>
  );
}

/* ---------------- Empty State ---------------- */
function EmptyState({ hasConsultants, onAddConsultant, onAddPatient }) {
  return (
    <div className="text-center py-16 px-4 rounded-xl border" style={{ borderColor: LINE, background: '#fff' }}>
      <div className="w-12 h-12 rounded-full mx-auto mb-3 flex items-center justify-center" style={{ background: PAPER }}>
        <Stethoscope size={22} color={SLATE} />
      </div>
      {!hasConsultants ? (
        <>
          <p className="font-medium mb-1" style={{ color: INK }}>Add your first consultant to get started</p>
          <p className="text-sm mb-4" style={{ color: SLATE }}>Patients are grouped under the consultant they're admitted with.</p>
          <button onClick={onAddConsultant} className="px-4 py-2 rounded-lg text-sm font-semibold text-white" style={{ background: ACCENT }}>Add consultant</button>
        </>
      ) : (
        <>
          <p className="font-medium mb-1" style={{ color: INK }}>No patients on the list yet</p>
          <p className="text-sm mb-4" style={{ color: SLATE }}>Add a patient to start tracking today's round.</p>
          <button onClick={onAddPatient} className="px-4 py-2 rounded-lg text-sm font-semibold text-white" style={{ background: ACCENT }}>Add patient</button>
        </>
      )}
    </div>
  );
}

/* ---------------- Patient Card ---------------- */
function PatientCard({ patient, consultant, onOpen }) {
  const day = dayCount(patient.admissionDate);
  const onAbx = patient.meds.antibiotics.length > 0;
  const latestFlags = Object.entries(patient.labs).filter(([name, arr]) => arr.length && isAbnormal(name, arr[arr.length - 1].value));

  return (
    <button
      onClick={onOpen}
      className="w-full text-left bg-white rounded-xl border p-3.5 flex items-center gap-3 hover:shadow-sm transition-shadow"
      style={{ borderColor: LINE, borderLeft: `4px solid ${consultant ? consultant.color : LINE}` }}
    >
      <div className="shrink-0 text-center w-16">
        <div className="font-mono font-semibold text-base" style={{ color: INK }}>{patient.ward}/{patient.bed}</div>
        <div className="text-[11px]" style={{ color: SLATE }}>Day {day}</div>
      </div>
      <div className="flex-1 min-w-0">
        <div className="flex items-center gap-2 flex-wrap">
          <span className="font-medium text-sm truncate" style={{ color: INK }}>{patient.diagnosis || 'No diagnosis set'}</span>
          <span
            className="text-[10px] font-semibold px-1.5 py-0.5 rounded uppercase"
            style={{ background: patient.admissionType === 'emergency' ? '#FBE7EA' : '#E9F5EA', color: patient.admissionType === 'emergency' ? RED : GREEN }}
          >
            {patient.admissionType}
          </span>
        </div>
        <div className="flex items-center gap-2.5 mt-1 text-[11px]" style={{ color: SLATE }}>
          {consultant && <span>{consultant.name}</span>}
          {patient.age && <span>· Age {patient.age}</span>}
          {onAbx && <span className="flex items-center gap-0.5"><Pill size={11} /> {patient.meds.antibiotics.length} abx</span>}
          {latestFlags.length > 0 && (
            <span className="flex items-center gap-0.5 font-semibold" style={{ color: RED }}>
              <AlertTriangle size={11} /> {latestFlags.length} flagged
            </span>
          )}
        </div>
      </div>
      <Edit2 size={15} color={SLATE} className="shrink-0" />
    </button>
  );
}

/* ---------------- Patient Modal ---------------- */
function PatientModal({ draft, setDraft, consultants, isNew, activeTab, setActiveTab, onClose, onSave, onRequestDischarge, showToast }) {
  const update = (patch) => setDraft({ ...draft, ...patch });
  const tabs = [
    { id: 'overview', label: 'Overview' },
    { id: 'labs', label: 'Labs' },
    { id: 'imaging', label: 'Imaging' },
    { id: 'meds', label: 'Medications' },
    { id: 'plan', label: 'Plan' }
  ];

  return (
    <div className="fixed inset-0 z-40 flex items-end sm:items-center justify-center bg-black/40 p-0 sm:p-4">
      <div className="bg-white w-full sm:max-w-2xl sm:rounded-2xl rounded-t-2xl max-h-[92vh] flex flex-col overflow-hidden">
        <div className="flex items-center justify-between px-4 py-3 border-b" style={{ borderColor: LINE }}>
          <div className="flex items-center gap-2">
            <button onClick={onClose} className="sm:hidden"><ArrowLeft size={18} color={INK} /></button>
            <h2 className="font-display font-semibold text-base" style={{ color: INK }}>
              {isNew ? 'Add patient' : `${draft.ward || '—'}/${draft.bed || '—'}`}
            </h2>
          </div>
          <button onClick={onClose} className="p-1"><X size={18} color={SLATE} /></button>
        </div>

        <div className="flex gap-1 px-4 pt-3 overflow-x-auto border-b" style={{ borderColor: LINE }}>
          {tabs.map((t) => (
            <button
              key={t.id}
              onClick={() => setActiveTab(t.id)}
              className="px-3 py-2 text-sm font-medium whitespace-nowrap border-b-2 -mb-px"
              style={activeTab === t.id ? { borderColor: ACCENT, color: ACCENT } : { borderColor: 'transparent', color: SLATE }}
            >
              {t.label}
            </button>
          ))}
        </div>

        <div className="flex-1 overflow-y-auto px-4 py-4">
          {activeTab === 'overview' && <OverviewTab draft={draft} update={update} consultants={consultants} />}
          {activeTab === 'labs' && <LabsTab draft={draft} update={update} showToast={showToast} />}
          {activeTab === 'imaging' && <ImagingTab draft={draft} update={update} showToast={showToast} />}
          {activeTab === 'meds' && <MedsTab draft={draft} update={update} />}
          {activeTab === 'plan' && <PlanTab draft={draft} update={update} />}
        </div>

        <div className="px-4 py-3 border-t flex items-center justify-between gap-2" style={{ borderColor: LINE }}>
          {!isNew ? (
            <button onClick={onRequestDischarge} className="text-sm font-semibold px-3 py-2 rounded-lg" style={{ color: RED }}>
              Discharge patient
            </button>
          ) : <span />}
          <div className="flex gap-2">

/* --- Labs Tab --- */
function LabsTab({ draft, update, showToast }) {
  const [newLabName, setNewLabName] = useState(LAB_PRESETS[0]);
  const [newLabValue, setNewLabValue] = useState('');
  const [ocrBusy, setOcrBusy] = useState(false);
  const fileRef = useRef(null);

  const addLabValue = (name, value, date = todayISO()) => {
    if (!name || value === '' || value === undefined || value === null) return;
    const labs = { ...draft.labs };
    const arr = labs[name] ? [...labs[name]] : [];
    const last = arr[arr.length - 1];
    if (last && last.date === date) arr[arr.length - 1] = { date, value: String(value) };
    else arr.push({ date, value: String(value) });
    labs[name] = arr;
    update({ labs });
  };

  const handleManualAdd = () => {
    addLabValue(newLabName, newLabValue);
    setNewLabValue('');
  };

  const handlePhotoOCR = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setOcrBusy(true);
    try {
      const dataUrl = await fileToResizedDataUrl(file);
      const instruction = 'This image shows a lab results report or a hospital-system screenshot. Extract every lab test and its most recent/current numeric value. Respond ONLY with JSON, nothing else, in this exact shape: {"labs":[{"name":"WBC","value":"9.4"}]}. Use these short names when the test matches: WBC, Hb, Plt, Na, K, Urea, Creatinine, CRP, Bilirubin, ALT, AST, Amylase, Lipase, Lactate, INR — otherwise use the label as printed.';
      const result = await callClaudeVision(dataUrl, instruction);
      if (result && Array.isArray(result.labs) && result.labs.length) {
        result.labs.forEach((l) => addLabValue(l.name, l.value));
        showToast(`Extracted ${result.labs.length} lab value(s)`);
      } else {
        showToast('Could not read labs from that photo — try manual entry');
      }
    } catch (err) {
      showToast('OCR failed — try manual entry');
    } finally {
      setOcrBusy(false);
      if (fileRef.current) fileRef.current.value = '';
    }
  };

  const labNames = Object.keys(draft.labs);

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between">
        <p className="text-xs font-semibold uppercase tracking-wide" style={{ color: SLATE }}>Trends</p>
        <label className="flex items-center gap-1.5 text-xs font-semibold px-3 py-1.5 rounded-lg border cursor-pointer" style={{ borderColor: LINE, color: ACCENT }}>
          {ocrBusy ? <Loader2 size={13} className="animate-spin" /> : <Camera size={13} />}
          {ocrBusy ? 'Reading photo…' : 'Photo of labs'}
          <input ref={fileRef} type="file" accept="image/*" capture="environment" className="hidden" onChange={handlePhotoOCR} disabled={ocrBusy} />
        </label>
      </div>

      {labNames.length === 0 && <p className="text-sm" style={{ color: SLATE }}>No labs recorded yet.</p>}

      <div className="space-y-2.5">
        {labNames.map((name) => {
          const arr = draft.labs[name];
          return (
            <div key={name} className="border rounded-lg px-3 py-2.5" style={{ borderColor: LINE }}>
              <div className="flex items-center justify-between mb-1.5">
                <span className="font-semibold text-sm" style={{ color: INK }}>{name}</span>
                <button onClick={() => { const labs = { ...draft.labs }; delete labs[name]; update({ labs }); }}>
                  <Trash2 size={13} color={SLATE} />
                </button>
              </div>
              <div className="flex items-center flex-wrap gap-1.5 font-mono text-sm">
                {arr.map((entry, i) => {
                  const isLast = i === arr.length - 1;
                  const abnormal = isAbnormal(name, entry.value);
                  return (
                    <React.Fragment key={i}>
                      {i > 0 && <span style={{ color: SLATE }}>›</span>}
                      <span
                        className="px-2 py-0.5 rounded font-semibold"
                        style={isLast
                          ? { background: abnormal ? RED : ACCENT, color: '#fff' }
                          : { background: abnormal ? '#FBE7EA' : '#EEF0F5', color: abnormal ? RED : SLATE }}
                      >
                        {entry.value}
                      </span>
                    </React.Fragment>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>

      <div className="flex gap-2 pt-1">
        <select value={newLabName} onChange={(e) => setNewLabName(e.target.value)} className="border rounded-lg px-2 py-2 text-sm" style={{ borderColor: LINE }}>
          {LAB_PRESETS.map((n) => <option key={n} value={n}>{n}</option>)}
        </select>
        <input value={newLabValue} onChange={(e) => setNewLabValue(e.target.value)} placeholder="Today's value" className="flex-1 border rounded-lg px-3 py-2 text-sm" style={{ borderColor: LINE }} />
        <button onClick={handleManualAdd} className="px-3 py-2 rounded-lg text-sm font-semibold text-white" style={{ background: ACCENT }}>Add</button>
      </div>
    </div>
  );
}

/* --- Imaging Tab --- */
function ImagingTab({ draft, update, showToast }) {
  const [type, setType] = useState(IMAGING_TYPES[0]);
  const [findings, setFindings] = useState('');
  const [image, setImage] = useState(null);
  const [ocrBusy, setOcrBusy] = useState(false);
  const fileRef = useRef(null);

  const handlePhoto = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const dataUrl = await fileToResizedDataUrl(file);
    setImage(dataUrl);
  };

  const extractFindings = async () => {
    if (!image) return;
    setOcrBusy(true);
    try {
      const instruction = 'This image shows a radiology report. Extract the findings and impression, combined into one concise clinical summary suitable for a ward round note. Respond ONLY with JSON, nothing else: {"findings":"..."}';
      const result = await callClaudeVision(image, instruction);
      if (result && result.findings) { setFindings(result.findings); showToast('Findings extracted'); }
      else showToast('Could not read the report — try typing findings manually');
    } catch (e) { showToast('OCR failed — try manual entry'); }
    finally { setOcrBusy(false); }
  };

  const addEntry = () => {
    if (!type) return;
    const entry = { id: uid(), type, findings, image };
    update({ imaging: [...draft.imaging, entry] });
    setFindings(''); setImage(null); setType(IMAGING_TYPES[0]);
    if (fileRef.current) fileRef.current.value = '';
  };

  const removeEntry = (id) => update({ imaging: draft.imaging.filter((im) => im.id !== id) });

  return (
    <div className="space-y-4">
      {draft.imaging.length > 0 && (
        <div className="space-y-2.5">
          {draft.imaging.map((im) => (
            <div key={im.id} className="border rounded-lg p-3 flex gap-3" style={{ borderColor: LINE }}>
              {im.image && <img src={im.image} className="w-16 h-16 object-cover rounded-md shrink-0" alt={im.type} />}
              <div className="flex-1 min-w-0">
                <div className="flex items-center justify-between">
                  <span className="font-semibold text-sm" style={{ color: INK }}>{im.type}</span>
                  <button onClick={() => removeEntry(im.id)}><Trash2 size={13} color={SLATE} /></button>
                </div>
                <p className="text-xs mt-0.5" style={{ color: SLATE }}>{im.findings || 'No findings noted'}</p>
              </div>
            </div>
          ))}
        </div>
      )}

      <div className="border rounded-lg p-3 space-y-2.5" style={{ borderColor: LINE, background: PAPER }}>
        <p className="text-xs font-semibold uppercase tracking-wide" style={{ color: SLATE }}>Add imaging</p>
        <select value={type} onChange={(e) => setType(e.target.value)} className="w-full border rounded-lg px-3 py-2 text-sm" style={{ borderColor: LINE }}>
          {IMAGING_TYPES.map((t) => <option key={t} value={t}>{t}</option>)}
        </select>

        <div className="flex items-center gap-2">
          <label className="flex items-center gap-1.5 text-xs font-semibold px-3 py-2 rounded-lg border cursor-pointer" style={{ borderColor: LINE, color: ACCENT, background: '#fff' }}>
            <Camera size={13} /> {image ? 'Retake photo' : 'Photo of report/image'}
            <input ref={fileRef} type="file" accept="image/*" capture="environment" className="hidden" onChange={handlePhoto} />
          </label>
          {image && (
            <button onClick={extractFindings} disabled={ocrBusy} className="flex items-center gap-1.5 text-xs font-semibold px-3 py-2 rounded-lg text-white" style={{ background: ACCENT }}>
              {ocrBusy ? <Loader2 size={13} className="animate-spin" /> : <ImageIcon size={13} />}
              {ocrBusy ? 'Extracting…' : 'Extract findings'}
            </button>
          )}
        </div>
        {image && <img src={image} className="w-20 h-20 object-cover rounded-md" alt="preview" />}

        <textarea value={findings} onChange={(e) => setFindings(e.target.value)} placeholder="Findings / impression" rows={2} className="w-full border rounded-lg px-3 py-2 text-sm" style={{ borderColor: LINE }} />
        <button onClick={addEntry} className="w-full px-3 py-2 rounded-lg text-sm font-semibold text-white" style={{ background: INK }}>Add imaging entry</button>
      </div>
    </div>
  );
}

/* --- Meds Tab --- */

    <div className="space-y-5">

        <p className="text-xs font-semibold uppercase tracking-wide mb-2" style={{ color: SLATE }}>On antibiotics</p>

          <div className="space-y-1.5 mb-2.5">

        </div>

function MedGroup({ label, options, selected, onToggle }) {

  );
}

/* --- Plan Tab --- */

        <div className="px-4 py-3 border-t flex justify-end gap-2" style={{ borderColor: LINE }}>
          <button onClick={onClose} className="px-4 py-2 rounded-lg text-sm font-medium border" style={{ borderColor: LINE, color: INK }}>Cancel</button>
          <button onClick={() => onConfirm({ selected, mode })} disabled={selected.length === 0} className="px-4 py-2 rounded-lg text-sm font-semibold text-white flex items-center gap-1.5" style={{ background: ACCENT, opacity: selected.length === 0 ? 0.5 : 1 }}>
            <FileText size={14} /> Generate PDF
          </button>
        </div>
      </div>
    </div>
  );
}

/* ---------------- Confirm Modal ---------------- */
function ConfirmModal({ title, message, confirmLabel, danger, onCancel, onConfirm }) {
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
      <div className="bg-white w-full max-w-sm rounded-2xl p-5">
        <div className="w-10 h-10 rounded-full flex items-center justify-center mb-3" style={{ background: danger ? '#FBE7EA' : PAPER }}>
          <AlertTriangle size={18} color={danger ? RED : INK} />
        </div>
        <h3 className="font-display font-semibold text-base mb-1.5" style={{ color: INK }}>{title}</h3>
        <p className="text-sm mb-5" style={{ color: SLATE }}>{message}</p>
        <div className="flex gap-2">
          <button onClick={onCancel} className="flex-1 px-4 py-2.5 rounded-lg text-sm font-medium border" style={{ borderColor: LINE, color: INK }}>Cancel</button>
          <button onClick={onConfirm} className="flex-1 px-4 py-2.5 rounded-lg text-sm font-semibold text-white" style={{ background: danger ? RED : ACCENT }}>{confirmLabel}</button>
        </div>
      </div>
    </div>
  );
}

/* ---------------- Print View ---------------- */
function PrintView({ config, patients, consultants }) {
  const included = consultants.filter((c) => config.selected.includes(c.id));
  const dateStr = new Date().toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' }).replace(/\//g, '.');

  return (
    <div className="print-only" style={{ fontFamily: 'Inter, sans-serif', color: '#111', padding: 24 }}>
      <h1 style={{ fontSize: 20, fontWeight: 700, marginBottom: 2 }}>Morning Round</h1>
      <p style={{ fontSize: 13, color: '#555', marginBottom: 18 }}>{dateStr}</p>

      {included.map((c) => {
        const pts = patients.filter((p) => p.consultantId === c.id).sort(sortByWardBed);
        if (pts.length === 0) return null;
        return (
          <div key={c.id} style={{ marginBottom: 20 }}>
            <h2 style={{ fontSize: 15, fontWeight: 700, borderBottom: '2px solid #111', paddingBottom: 4, marginBottom: 10 }}>{c.name}</h2>
            {pts.map((p) => (
              <div key={p.id} style={{ marginBottom: 12, pageBreakInside: 'avoid' }}>
                <p style={{ fontSize: 13, fontWeight: 700 }}>
                  {p.ward}/{p.bed} — {p.diagnosis} (Day {dayCount(p.admissionDate)})
                </p>
                {config.mode === 'summary' ? (
                  <div style={{ fontSize: 11.5, color: '#333', lineHeight: 1.5, marginLeft: 4 }}>
                    <p>Age {p.age || '-'} · {p.admissionType} · {p.comorbidities.join(', ') || 'No comorbidities noted'}{p.comorbidityOther ? `, ${p.comorbidityOther}` : ''}</p>
                    {Object.keys(p.labs).length > 0 && (
                      <p>Labs: {Object.entries(p.labs).map(([n, arr]) => `${n} ${arr[arr.length - 1].value}`).join(' | ')}</p>
                    )}
                    {p.imaging.length > 0 && <p>Imaging: {p.imaging.map((im) => `${im.type} — ${im.findings || 'pending'}`).join('; ')}</p>}
                    {p.meds.antibiotics.length > 0 && <p>Antibiotics: {p.meds.antibiotics.map((a) => `${a.name} (Day ${dayCount(a.startDate)})`).join(', ')}</p>}
                    <p style={{ fontWeight: 600, marginTop: 2 }}>Plan: {p.plan.isDischarge ? 'Discharge' : 'Continue stay'} — {p.plan.items.join(', ') || '-'}{p.plan.freeText ? `. ${p.plan.freeText}` : ''}</p>
                  </div>
                ) : (
                  <p style={{ fontSize: 11.5, color: '#333', marginLeft: 4 }}>
                    {p.plan.isDischarge ? 'Discharge' : 'Continue stay'} — {p.plan.items.join(', ') || '-'}{p.plan.freeText ? `. ${p.plan.freeText}` : ''}
                  </p>
                )}
              </div>
            ))}
          </div>
        );
      })}
      <p style={{ fontSize: 9, color: '#999', marginTop: 24, textAlign: 'right' }}>Founded by Dr. Mohamed Khamis</p>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>
</body>
</html>
